l_english:
 ENG_neutrality:0 "United Kingdom"
 ENG_neutrality_DEF:0 "the United Kingdom"
 ENG_neutrality_ADJ:0 "British"
 ENG:0 "United Kingdom"
 ENG_DEF:0 "the United Kingdom"
 ENG_ADJ:0 "British"
 ENG_the_failing_realm:0 "The Failing Realm"
 ENG_the_failing_realm_desc:0 "The Empire is gone, the treasury is empty, industry is obsolete, and the authority of the absolute Crown barely extends beyond exhausted local institutions. Without immediate intervention, the United Kingdom will disintegrate."
 ENG_national_collapse:0 "National Collapse"
 ENG_national_collapse_desc:0 "The Crown failed to arrest the crisis. Administration, production, and military cohesion are collapsing as rebellion spreads through the country."
 ENG_realm_preserved:0 "The Realm Preserved"
 ENG_realm_preserved_desc:0 "Decisive emergency measures have prevented immediate dissolution. Britain remains poor and diminished, but the state can function and recovery is possible."
 ENG_royal_survival:0 "Save the Realm"
 ENG_royal_survival_desc:0 "The absolute monarchy has two years to stabilize food supplies, public finances, industry, and local government. Failure will bring national collapse."
 ENG_national_collapse_countdown:0 "The Kingdom Approaches Collapse"
 ENG_national_collapse_countdown_desc:0 "If the Crown cannot complete the Royal Recovery programme before this deadline, anti-monarchist revolt and institutional failure will tear the United Kingdom apart."
 ENG_open_the_royal_granaries:0 "Open the Royal Granaries"
 ENG_open_the_royal_granaries_desc:0 "Release the Crown's emergency food reserves to halt hunger and urban unrest."
 ENG_liquidate_overseas_crown_assets:0 "Liquidate Overseas Crown Assets"
 ENG_liquidate_overseas_crown_assets_desc:0 "The Empire is gone. Selling the monarchy's remaining foreign holdings will provide desperately needed liquidity."
 ENG_bargain_with_the_industrial_guilds:0 "Bargain with the Industrial Guilds"
 ENG_bargain_with_the_industrial_guilds_desc:0 "Grant concessions to the surviving manufacturers in exchange for keeping Britain's obsolete factories operating."
 ENG_restore_the_county_administrations:0 "Restore the County Administrations"
 ENG_restore_the_county_administrations_desc:0 "Fund local government, repair civil records, and reconnect the counties to the royal administration."
 ENG_proclaim_the_royal_recovery:0 "Proclaim the Royal Recovery"
 ENG_proclaim_the_royal_recovery_desc:0 "With the emergency programme completed, the King can declare the immediate crisis contained and begin Britain's long reconstruction."
 british_collapse.1.t:0 "The United Kingdom Collapses"
 british_collapse.1.d:0 "The Crown has exhausted its money, authority, and remaining public trust. Local administrations have ceased obeying London, mutinies are spreading through the security forces, and an anti-monarchist coalition has called the nation to arms. The old United Kingdom is tearing itself apart."
 british_collapse.1.a:0 "The realm is lost."
 british_collapse.2.t:0 "The Realm Endures"
 british_collapse.2.d:0 "Food reaches the cities, county administrations answer London, and the surviving industries have resumed production. Britain remains a poor shadow of its imperial past, but King William V has prevented the collapse of the United Kingdom."
 british_collapse.2.a:0 "The Crown has bought Britain a future."
