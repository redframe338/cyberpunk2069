 arasaka_operations:0 "Arasaka Operations in Japan"
 arasaka_operations_desc:0 "Strategic decisions for expanding Arasaka's corporate influence, territorial control, and political power within Japan."
 arasaka_question:0 "The Arasaka Question"
 arasaka_question_desc:0 "Decisions regarding Japan's relationship with Arasaka Corporation — from cooperation and dependence to regulation and confrontation."

 ARK_expand_security_contracts:0 "Expand Corporate Security Contracts"
 ARK_expand_security_contracts_desc:0 "Negotiate additional security contracts with Japanese government agencies, expanding Arasaka's operational footprint and influence."
 ARK_finance_political_candidates:0 "Finance Japanese Political Candidates"
 ARK_finance_political_candidates_desc:0 "Channel corporate funds to sympathetic political candidates who will advance Arasaka interests within the Japanese government."
 ARK_purchase_strategic_infrastructure:0 "Purchase Strategic Infrastructure"
 ARK_purchase_strategic_infrastructure_desc:0 "Acquire critical infrastructure assets — power grids, communication networks, transportation hubs — to deepen economic control."
 ARK_establish_research_campus:0 "Establish New Research Campus"
 ARK_establish_research_campus_desc:0 "Build a new advanced research facility to expand Arasaka's technological capabilities in cybernetics, AI, and weapons development."
 ARK_infiltrate_interior_ministry:0 "Infiltrate the Interior Ministry"
 ARK_infiltrate_interior_ministry_desc:0 "Place Arasaka operatives within the Japanese Interior Ministry to gain intelligence and influence domestic policy decisions."
 ARK_pressure_japanese_cabinet:0 "Pressure the Japanese Cabinet"
 ARK_pressure_japanese_cabinet_desc:0 "Use economic leverage, intelligence assets, and political connections to pressure the Japanese Cabinet into making pro-Arasaka policy decisions."
 ARK_demand_greater_autonomy:0 "Demand Greater Corporate Autonomy"
 ARK_demand_greater_autonomy_desc:0 "Formally demand expanded autonomy rights from the Japanese government, threatening economic retaliation if refused."
 ARK_prepare_corporate_government:0 "Prepare a Corporate Government"
 ARK_prepare_corporate_government_desc:0 "Begin laying the groundwork for a complete corporate takeover of the Japanese government. This is the point of no return."
 ARK_secure_additional_port:0 "Secure an Additional Port Facility"
 ARK_secure_additional_port_desc:0 "Expand Arasaka's naval logistics capacity by securing additional port facilities and dockyard access."
 ARK_undermine_opposition:0 "Undermine Anti-Arasaka Politicians"
 ARK_undermine_opposition_desc:0 "Deploy intelligence assets to discredit, compromise, or neutralize politicians who oppose Arasaka's interests."

 JAP_renew_arasaka_contracts:0 "Renew Arasaka Defense Contracts"
 JAP_renew_arasaka_contracts_desc:0 "Renew existing defense contracts with Arasaka Corporation, maintaining the economic and military partnership."
 JAP_audit_arasaka_finances:0 "Audit Arasaka Finances"
 JAP_audit_arasaka_finances_desc:0 "Launch a government audit of Arasaka's financial operations in Japan to uncover hidden influence and reduce corporate control."
 JAP_restrict_corporate_security:0 "Restrict Corporate Security Forces"
 JAP_restrict_corporate_security_desc:0 "Pass legislation limiting the size and operational scope of Arasaka's paramilitary security forces within Japanese territory."
 JAP_nationalize_facilities:0 "Nationalize Strategic Facilities"
 JAP_nationalize_facilities_desc:0 "Seize Arasaka-owned strategic facilities and place them under government control. This will severely damage the corporate relationship."
 JAP_support_domestic_competitors:0 "Support Domestic Competitors"
 JAP_support_domestic_competitors_desc:0 "Provide government subsidies and contracts to domestic corporations to reduce Japan's dependence on Arasaka."
 JAP_investigate_arasaka_intel:0 "Investigate Arasaka Intelligence Operations"
 JAP_investigate_arasaka_intel_desc:0 "Launch a counter-intelligence investigation into Arasaka's espionage activities within Japan."
 JAP_renegotiate_autonomy:0 "Renegotiate Corporate Autonomy"
 JAP_renegotiate_autonomy_desc:0 "Open formal negotiations to reduce Arasaka's autonomous privileges and reassert government authority."
 JAP_seize_arasaka_assets:0 "Seize Arasaka Military Assets"
 JAP_seize_arasaka_assets_desc:0 "Order the seizure of Arasaka's military equipment, weapons stockpiles, and restricted technology within Japan. This is an act of extreme confrontation."
 JAP_accept_strategic_partnership:0 "Accept Arasaka Strategic Partnership"
 JAP_accept_strategic_partnership_desc:0 "Formally recognize Arasaka as Japan's primary strategic partner, granting additional economic and political privileges."
 JAP_expel_from_ministries:0 "Expel Arasaka from Government Ministries"
 JAP_expel_from_ministries_desc:0 "Remove all Arasaka-affiliated personnel from positions within government ministries and agencies."

 arasaka_japan.1.t:0 "Corporate Jurisdiction Dispute"
 arasaka_japan.1.d:0 "A dispute has arisen between Arasaka Corporation and the Japanese government over the extent of corporate jurisdiction within the Tokyo Headquarters District. Local authorities demand access to investigate criminal activity, while Arasaka insists on corporate sovereignty over its territory."
 arasaka_japan.1.a:0 "Assert corporate jurisdiction"
 arasaka_japan.1.b:0 "Allow limited government access"

 arasaka_japan.2.t:0 "Arasaka Military Deployment"
 arasaka_japan.2.d:0 "Arasaka has deployed additional corporate security forces to its enclaves, ostensibly for routine training exercises. The Japanese military views this as a provocative escalation. Arasaka claims the deployments are within its sovereign rights."
 arasaka_japan.2.a:0 "The deployments are necessary for corporate security"
 arasaka_japan.2.b:0 "Scale back to avoid provoking Japan"

 arasaka_japan.3.t:0 "Dependence on Arasaka Technology"
 arasaka_japan.3.d:0 "An internal review reveals that Japan's military and civilian infrastructure has become deeply dependent on Arasaka-manufactured technology. Critical defense systems, communication networks, and cybernetic implants all rely on Arasaka proprietary systems."
 arasaka_japan.3.a:0 "Deepen the partnership — we need their technology"
 arasaka_japan.3.b:0 "Begin developing domestic alternatives"

 arasaka_japan.4.t:0 "Arasaka Political Scandal"
 arasaka_japan.4.d:0 "Investigative journalists have uncovered evidence that Arasaka Corporation has been secretly funding political campaigns, placing operatives in government positions, and manipulating policy decisions. The scandal threatens to destabilize the government."
 arasaka_japan.4.a:0 "Launch a full investigation"
 arasaka_japan.4.b:0 "Suppress the story to maintain stability"

 arasaka_japan.5.t:0 "Response to Nationalization"
 arasaka_japan.5.d:0 "Japan has begun nationalizing Arasaka facilities. Our assets are being seized, our personnel detained, and our operations shut down. This is an existential threat to the corporation."
 arasaka_japan.5.a:0 "Mobilize corporate security — defend our territory"
 arasaka_japan.5.b:0 "Accept the losses and negotiate"

 arasaka_japan.6.t:0 "Intelligence Investigation Results"
 arasaka_japan.6.d:0 "The investigation into Arasaka's intelligence operations has produced results. Evidence of corporate espionage, surveillance of government officials, and manipulation of public opinion has been documented."
 arasaka_japan.6.a:0 "Use the evidence to further restrict Arasaka"
 arasaka_japan.6.b:0 "File the report and move on"

 arasaka_japan.7.t:0 "Autonomy Renegotiation"
 arasaka_japan.7.d:0 "The Japanese government has opened formal negotiations to revise the terms of Arasaka's corporate sovereignty. They demand reduced autonomy, greater government oversight, and increased tax contributions."
 arasaka_japan.7.a:0 "Impose stricter terms"
 arasaka_japan.7.b:0 "The current arrangement serves Japan well"

 arasaka_japan.8.t:0 "Asset Seizure Crisis"
 arasaka_japan.8.d:0 "Japan has moved to seize Arasaka military assets. Corporate armories, weapons stockpiles, and military vehicles are being confiscated. This is an unprecedented act of aggression against the corporation."
 arasaka_japan.8.a:0 "This means war"
 arasaka_japan.8.b:0 "We cannot win this fight — negotiate surrender"

 arasaka_japan.9.t:0 "Expelled from Government"
 arasaka_japan.9.d:0 "Japan has expelled all Arasaka-affiliated personnel from government positions. Our influence networks within the ministries have been dismantled. Years of careful positioning have been undone."
 arasaka_japan.9.a:0 "Rebuild our networks through other channels"
 arasaka_japan.9.b:0 "Retaliate with economic pressure"

 arasaka_japan.10.t:0 "Corporate Government Ready"
 arasaka_japan.10.d:0 "Our preparations are complete. Arasaka has the political connections, intelligence assets, economic leverage, and military capability to establish effective control over the Japanese government. The board awaits your decision."
 arasaka_japan.10.a:0 "Execute the takeover"
 arasaka_japan.10.b:0 "Not yet — consolidate our position"

 arasaka_japan.11.t:0 "The Corporate Takeover"
 arasaka_japan.11.d:0 "Arasaka Corporation has made its move. Corporate executives have presented the government with an ultimatum: accept Arasaka's 'guidance' or face economic collapse and military confrontation. Japan stands at a crossroads."
 arasaka_japan.11.a:0 "Accept Arasaka's terms — we have no choice"
 arasaka_japan.11.b:0 "We will fight for Japan's sovereignty"

 arasaka_japan.12.t:0 "Protests Against Corporate Autonomy"
 arasaka_japan.12.d:0 "Mass protests have erupted across Japan. Citizens are demanding that the government reduce Arasaka's power and reclaim national sovereignty. The protests threaten to destabilize the political situation."
 arasaka_japan.12.a:0 "Support the protesters — restrict Arasaka"
 arasaka_japan.12.b:0 "Disperse the protests to maintain order"

 arasaka_japan.13.t:0 "Rival Corporate Interference"
 arasaka_japan.13.d:0 "Militech and other rival corporations have been detected funding anti-Arasaka movements in Japan. They seek to weaken our position and steal our contracts. This interference must be addressed."
 arasaka_japan.13.a:0 "Launch counter-operations against the rivals"
 arasaka_japan.13.b:0 "Focus on strengthening our own position"

 arasaka_japan.14.t:0 "Arasaka Demands an Expanded Naval Charter"
 arasaka_japan.14.d:0 "Arasaka Corporation has formally requested broader jurisdiction and additional facilities inside its existing Okinawa naval enclave. The demand stops short of claiming another Japanese region, but would deepen corporate control over a strategically vital port."
 arasaka_japan.14.a:0 "Expand the charter to maintain the partnership"
 arasaka_japan.14.b:0 "Refuse — Japan's territory is not for sale"

 arasaka_japan.15.t:0 "Negotiated Settlement"
 arasaka_japan.15.d:0 "After extensive negotiations, Japan and Arasaka have reached a new corporate charter. The agreement establishes clear boundaries for territorial control, economic obligations, and military cooperation."
 arasaka_japan.15.a:0 "Sign the charter"
 arasaka_japan.15.b:0 "The terms are unacceptable"

 ARK_corporate_headquarters_modifier:0 "Corporate Headquarters"
 ARK_corporate_headquarters_modifier_desc:0 "The fortified center of the Arasaka dynasty, its executive government, and its intelligence apparatus."
 ARK_corporate_industrial_modifier:0 "Corporate Industrial Complex"
 ARK_corporate_industrial_modifier_desc:0 "A secured weapons-manufacturing zone built around tightly integrated corporate production."
 ARK_port_authority_modifier:0 "Corporate Port Authority"
 ARK_port_authority_modifier_desc:0 "Arasaka administers this port as a military logistics and overseas deployment hub."
 ARK_secured_zone_modifier:0 "Secured Corporate Zone"
 ARK_secured_zone_modifier_desc:0 "Layered surveillance, private fortifications, and controlled access protect this security complex."
 ARK_research_campus_modifier:0 "Corporate Research Campus"
 ARK_research_campus_modifier_desc:0 "A restricted high-technology campus specializing in computing, surveillance, cybernetics, and weapons research."
