 ARK_chief_executive_officer:0 "Chief Executive Officer"
 ARK_chief_executive_officer_desc:0 "Saburo Arasaka exercises absolute executive authority over the corporation, directing its political influence, industrial empire, and global strategy."
 ARK_oceanic_security_hegemony:0 "Oceanic Security Hegemony"
 ARK_oceanic_security_hegemony_desc:0 "Arasaka's naval arm is a globe-spanning corporate battle network supported by autonomous logistics, hardened security fleets, and deep-water power projection."

 STATE_532:0 "Arasaka Headquarters District"
