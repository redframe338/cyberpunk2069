 RULE_DESC_CORPORATE_SOVEREIGNTY:0 "Corporate Sovereignty"
 autonomy_corporate_sovereignty:0 "Corporate Sovereignty"
 autonomy_corporate_sovereignty_desc:0 "A corporation operating under the nominal sovereignty of a national government while possessing extensive political, military, economic, and legal autonomy."
 ARK_autonomy_demand:0 "Arasaka demands greater autonomy"
 ARK_autonomy_renegotiated:0 "Autonomy renegotiated"

 ARK_arasaka_dynasty:0 "The Arasaka Dynasty"
 ARK_arasaka_dynasty_desc:0 "The Arasaka family maintains absolute control over the corporation through an iron-clad succession system. Saburo Arasaka's vision guides every strategic decision, ensuring unwavering corporate unity."
 ARK_corporate_security_state:0 "Corporate Security State"
 ARK_corporate_security_state_desc:0 "Arasaka operates the most sophisticated private intelligence and security apparatus in the world. Corporate counter-intelligence, surveillance networks, and paramilitary forces ensure total control within Arasaka territories."
 ARK_zaibatsu_war_machine:0 "Zaibatsu War Machine"
 ARK_zaibatsu_war_machine_desc:0 "Arasaka's vertically integrated military-industrial complex produces cutting-edge weapons, cybernetics, and military hardware. Corporate factories operate at peak efficiency under centralized control."
 ARK_global_corporate_network:0 "Global Corporate Network"
 ARK_global_corporate_network_desc:0 "Arasaka maintains offices, subsidiaries, shell companies, and operative networks across every major nation. This global reach provides intelligence, economic leverage, and rapid deployment capabilities."

 JAP_arasaka_dependency:0 "Arasaka Dependency"
 JAP_arasaka_dependency_desc:0 "Japan's military and economic infrastructure has become deeply intertwined with Arasaka Corporation. While the zaibatsu provides technological and industrial benefits, this dependency limits the government's political independence."

 ARK_influence_restricted:0 "Restricted Corporation"
 ARK_influence_restricted_desc:0 "Arasaka's influence over Japan is minimal. The corporation is heavily regulated and its operations are closely monitored by the Japanese government."
 ARK_influence_contractor:0 "Influential Contractor"
 ARK_influence_contractor_desc:0 "Arasaka has established itself as a significant defense contractor and economic partner. The corporation's influence is growing but still constrained by government oversight."
 ARK_influence_partner:0 "Strategic National Partner"
 ARK_influence_partner_desc:0 "Arasaka is recognized as a strategic partner essential to Japan's defense and economic infrastructure. The corporation wields considerable political influence."
 ARK_influence_state_within_state:0 "State Within the State"
 ARK_influence_state_within_state_desc:0 "Arasaka has become a parallel power structure within Japan. Corporate security forces operate with near-impunity, and Arasaka executives hold significant sway over government policy."
 ARK_influence_government_control:0 "Government Under Arasaka Influence"
 ARK_influence_government_control_desc:0 "The Japanese government is effectively a client of Arasaka Corporation. Key ministries answer to corporate interests, and national policy aligns with Arasaka's strategic objectives."
 ARK_influence_dominance:0 "Arasaka Dominance"
 ARK_influence_dominance_desc:0 "Arasaka Corporation has achieved complete control over Japan's political, military, and economic systems. The government exists as a corporate subsidiary in all but name."

