 autonomy_strategic_national_defense_corporation:0 "Strategic National Defense Corporation"
 autonomy_strategic_national_defense_corporation_desc:0 "A nationally chartered defense corporation with its own budget, research, industrial planning, security forces, and operational command under the strategic sovereignty of the People's Republic of China."
 RULE_DESC_STRATEGIC_NATIONAL_DEFENSE_CORPORATION:0 "Kang Tao independently manages its research, production, exports, and armed security forces, but cannot wage territorial wars or annex Chinese territory without authorization from Beijing."

 KGT_precision_manufacturing:0 "Precision Manufacturing"
 KGT_precision_manufacturing_desc:0 "Automated machining, rigorous tolerances, and vertically integrated electronics production make Kang Tao equipment exceptionally consistent at industrial scale."
 KGT_smart_weapons_pioneer:0 "Smart Weapons Pioneer"
 KGT_smart_weapons_pioneer_desc:0 "Kang Tao is a world leader in guided ammunition, networked targeting, smart rifles, and battlefield electronics."
 KGT_integrated_robotics_industry:0 "Integrated Robotics Industry"
 KGT_integrated_robotics_industry_desc:0 "Robotics development, manufacturing, and military integration operate as a single corporate ecosystem."
 KGT_global_arms_exporter:0 "Global Arms Exporter"
 KGT_global_arms_exporter_desc:0 "Kang Tao supplies advanced weapons and electronics across the world while Qingdao coordinates its international logistics network."
 KGT_export_superpower:0 "Advanced Arms Export Superpower"
 KGT_export_superpower_desc:0 "Kang Tao has become the world's leading exporter of smart weapons, military electronics, drones, and precision defense systems."
 KGT_autonomous_combat_systems:0 "Autonomous Combat Systems"
 KGT_autonomous_combat_systems_desc:0 "Tactical artificial intelligence and semi-autonomous platforms shorten the sensor-to-shooter chain."
 KGT_government_oversight:0 "Government Oversight Commission"
 KGT_government_oversight_desc:0 "Chinese regulators have tightened supervision over Kang Tao's contracts, research, and corporate finances."
 KGT_export_restrictions:0 "Defense Export Restrictions"
 KGT_export_restrictions_desc:0 "Beijing has temporarily restricted Kang Tao's overseas weapons sales to preserve strategic control."
 KGT_wartime_mobilization:0 "Wartime Production Protocol"
 KGT_wartime_mobilization_desc:0 "Kang Tao's facilities are operating around the clock to fulfill emergency Chinese defense requirements."
 CHI_kangtao_defense_partnership:0 "Kang Tao Defense Partnership"
 CHI_kangtao_defense_partnership_desc:0 "The People's Liberation Army benefits from Kang Tao smart weapons, robotics, precision manufacturing, and military electronics."

 KGT_influence_approved_contractor:0 "Influence: Approved Contractor"
 KGT_influence_approved_contractor_desc:0 "Kang Tao remains a closely supervised supplier with limited strategic influence."
 KGT_influence_strategic_supplier:0 "Influence: Strategic Supplier"
 KGT_influence_strategic_supplier_desc:0 "Kang Tao has become an important supplier to China's defense establishment."
 KGT_influence_national_partner:0 "Influence: National Defense Partner"
 KGT_influence_national_partner_desc:0 "Kang Tao participates directly in national military modernization and strategic procurement."
 KGT_influence_technology_leader:0 "Influence: Military Technology Leader"
 KGT_influence_technology_leader_desc:0 "Chinese military planning increasingly depends upon Kang Tao's technical leadership."
 KGT_influence_defense_giant:0 "Influence: Corporate Defense Giant"
 KGT_influence_defense_giant_desc:0 "Kang Tao dominates crucial sectors of China's defense-industrial system."
 KGT_influence_state_within_state:0 "Influence: State Within a State"
 KGT_influence_state_within_state_desc:0 "Kang Tao possesses enough industrial, military, and political power to operate almost as a parallel state."

 KGT_corporate_headquarters_modifier:0 "Kang Tao Global Headquarters"
 KGT_corporate_headquarters_modifier_desc:0 "Hong Kong hosts Kang Tao's executive command, smart-weapons laboratories, encryption center, and global coordination network."
 KGT_international_export_port_modifier:0 "Kang Tao International Export Port"
 KGT_international_export_port_modifier_desc:0 "Qingdao handles overseas arms sales, strategic cargo, electronics imports, and corporate naval logistics."
 KGT_drone_missile_complex_modifier:0 "Drone and Missile Development Complex"
 KGT_drone_missile_complex_modifier_desc:0 "Dalian combines drone assembly, missile engineering, precision ammunition, and fortified coastal production."
 KGT_robotics_engineering_campus_modifier:0 "Robotics Engineering Campus"
 KGT_robotics_engineering_campus_modifier_desc:0 "The Hong Kong robotics campus develops autonomous systems and advanced manufacturing processes."

 kangtao_corporate_expansion:0 "Kang Tao Corporate Expansion"
 kangtao_corporate_expansion_desc:0 "Direct Kang Tao's investments in smart weapons, drones, missiles, robotics, electronics, exports, and military logistics."
 chinese_defense_policy:0 "Chinese Defense Policy"
 chinese_defense_policy_desc:0 "Beijing can fund Kang Tao as a strategic national asset or restrain it if corporate influence threatens state authority."

 KGT_expand_drone_production:0 "Expand Drone Production"
 KGT_expand_drone_production_desc:0 "Add automated assembly lines to the Dalian drone and missile complex."
 KGT_develop_smart_rifles:0 "Develop Smart Rifles"
 KGT_develop_smart_rifles_desc:0 "Advance guided ammunition, integrated optics, biometric controls, and networked infantry weapons."
 KGT_modernize_missile_programs:0 "Modernize Missile Programs"
 KGT_modernize_missile_programs_desc:0 "Invest in guidance electronics, compact propulsion, and precision strike systems."
 KGT_increase_robotics_manufacturing:0 "Increase Robotics Manufacturing"
 KGT_increase_robotics_manufacturing_desc:0 "Expand autonomous systems production at the Hong Kong engineering campus."
 KGT_construct_new_research_centers:0 "Construct New Research Centers"
 KGT_construct_new_research_centers_desc:0 "Create a new generation of secure laboratories linking every corporate enclave."
 KGT_expand_export_capacity:0 "Expand Export Capacity"
 KGT_expand_export_capacity_desc:0 "Increase dockyard and container capacity at the fortified Qingdao export port."
 KGT_develop_autonomous_combat_systems:0 "Develop Autonomous Combat Systems"
 KGT_develop_autonomous_combat_systems_desc:0 "Integrate battlefield artificial intelligence, robotics, and networked targeting into a unified combat architecture."
 KGT_modernize_corporate_logistics:0 "Modernize Corporate Logistics"
 KGT_modernize_corporate_logistics_desc:0 "Improve high-security freight corridors between Kang Tao's scattered enclaves."
 KGT_wartime_production_protocol:0 "Activate Wartime Production Protocol"
 KGT_wartime_production_protocol_desc:0 "Shift the corporation to emergency military production while China is at war."
 KGT_proclaim_export_superpower:0 "Proclaim an Export Superpower"
 KGT_proclaim_export_superpower_desc:0 "Use Kang Tao's technology and Qingdao logistics network to dominate the global market for advanced weapons."
 KGT_petition_for_expanded_charter:0 "Petition for an Expanded Charter"
 KGT_petition_for_expanded_charter_desc:0 "Our importance to national defense justifies greater legal and operational autonomy from Beijing."

 CHI_award_kangtao_defense_contracts:0 "Award Kang Tao Defense Contracts"
 CHI_award_kangtao_defense_contracts_desc:0 "Grant Kang Tao new procurement contracts and greater operational freedom."
 CHI_increase_kangtao_oversight:0 "Increase Government Oversight"
 CHI_increase_kangtao_oversight_desc:0 "Expand regulatory supervision and reduce excessive corporate influence."
 CHI_launch_national_defense_modernization:0 "Launch National Defense Modernization"
 CHI_launch_national_defense_modernization_desc:0 "Coordinate PLA modernization with Kang Tao's electronics and smart-weapons expertise."
 CHI_expand_weapons_procurement:0 "Expand Weapons Procurement"
 CHI_expand_weapons_procurement_desc:0 "Place a new series of large orders with Kang Tao's precision manufacturing plants."
 CHI_strengthen_kangtao_export_controls:0 "Strengthen Export Controls"
 CHI_strengthen_kangtao_export_controls_desc:0 "Restrict sensitive overseas sales and reassert Beijing's control of strategic technology."
 CHI_launch_smart_army_initiative:0 "Launch the Smart Army Initiative"
 CHI_launch_smart_army_initiative_desc:0 "Use Kang Tao targeting, communications, and battlefield electronics to modernize the PLA."
 CHI_impose_direct_control_on_kangtao:0 "Impose Direct State Control"
 CHI_impose_direct_control_on_kangtao_desc:0 "After first reducing Kang Tao's influence, Beijing may revoke its strategic charter and impose direct control. The political and economic disruption will be severe."

 KGT_chinese_strategic_asset:0 "Chinese Strategic Defense Asset"
 KGT_arasaka_technology_partner:0 "Arasaka Technology Partnership"
 KGT_militech_export_competitor:0 "Advanced Arms Export Competition"

 kangtao.1.t:0 "Kang Tao in 2069"
 kangtao.1.d:0 "From fortified corporate enclaves in Hong Kong, Qingdao, and Dalian, Kang Tao has become China's premier smart-weapons and defense electronics corporation. It commands its own security forces and global export network while remaining a strategic national asset under Beijing."
 kangtao.1.a:0 "Serve China through technical excellence."
 kangtao.1.b:0 "Expand our authority within the defense establishment."
 kangtao.2.t:0 "A Major Weapons Contract"
 kangtao.2.d:0 "Beijing has offered Kang Tao a major contract for a new generation of guided infantry weapons. Prioritizing PLA requirements would increase our national influence, while a broader export run could produce greater immediate profits."
 kangtao.2.a:0 "Prioritize the national contract."
 kangtao.2.b:0 "Expand the export production run."
 kangtao.3.t:0 "Drone Warfare Breakthrough"
 kangtao.3.d:0 "Engineers at Dalian have demonstrated a new autonomous coordination system capable of controlling dispersed reconnaissance and attack drones through a hardened tactical network."
 kangtao.3.a:0 "Fund further military research."
 kangtao.3.b:0 "Move the system into mass production."
 kangtao.4.t:0 "The Arasaka Technology Fair"
 kangtao.4.d:0 "Arasaka representatives have invited Kang Tao to a closed defense technology exhibition. Cooperation could open Japanese markets and reinforce a useful counterweight to Militech."
 kangtao.4.a:0 "Build the Arasaka partnership."
 kangtao.4.b:0 "Keep the technology under Chinese control."
 kangtao.5.t:0 "Cyberattack on the Research Network"
 kangtao.5.d:0 "A sophisticated intrusion has compromised part of Kang Tao's distributed research network. Emergency isolation can contain the breach, but continuing operations risks lost data and damaged confidence."
 kangtao.5.a:0 "Fund a complete security overhaul."
 kangtao.5.b:0 "Keep production online."
 kangtao.6.t:0 "Industrial Sabotage"
 kangtao.6.d:0 "Sabotage has disrupted a precision manufacturing line and raised questions about foreign corporate espionage. A costly investigation may restore security; concealing the incident would preserve cash at the expense of trust."
 kangtao.6.a:0 "Secure every facility."
 kangtao.6.b:0 "Conceal the damage."
