l_english:
 corporate_warfare:0 "Corporate Warfare"
 corporate_warfare_desc:0 "Sovereign megacorporations compete through sabotage, proxy operations, and open warfare. A sufficiently powerful board may authorize the hostile takeover of a rival corporation."
 corporate_hostile_takeover:0 "Authorize Hostile Takeover of [FROM.GetNameDef]"
 corporate_hostile_takeover_desc:0 "Prepare a corporate war against [FROM.GetNameDef]. Completing this decision grants a temporary annexation war goal against the rival corporation."

 unification_war.1.t:0 "The Unification War Begins"
 unification_war.1.d:0 "President Rosalind Myers has ordered the New United States Armed Forces and Militech to begin the reunification of the western territories. Federal armor is moving toward Colorado, New Mexico, Wyoming, Montana, Arizona, and Nevada. NUSA loyalists call it the Unification War. Across the West, it already has another name: the Metal Wars."
 unification_war.1.a:0 "One nation, restored by force."
 unification_war.2.t:0 "The Federal Ultimatum"
 unification_war.2.d:0 "Washington has demanded that Oregon, Washington, and Idaho accept immediate federal administration. The corporate governments reject annexation, but must decide whether to remain armed and neutral or join the Free States in the Metal Wars."
 unification_war.2.a:0 "Reject annexation but avoid open war."
 unification_war.2.b:0 "Reject the ultimatum and mobilize."
 unification_war.3.t:0 "Unmarked Arasaka Shipments"
 unification_war.3.d:0 "Convoys have arrived carrying rifles, support equipment, encrypted communications systems, and military advisors. Every serial number has been removed, but no one doubts the source. Arasaka will arm the Free States while keeping its flag away from the battlefield."
 unification_war.3.a:0 "The enemy of our enemy has excellent weapons."
 unification_war.4.t:0 "The Treaty of Unification"
 unification_war.4.d:0 "The Metal Wars have reached total exhaustion. Neither federal armor nor the mass mobilization of the western states can force a decisive result, while Arasaka intervention threatens a wider corporate war. The proposed ceasefire restores every prewar border. No government gains territory, and every government claims it was never defeated."
 unification_war.4.a:0 "Accept the stalemate and restore the prewar borders."
 unification_war.5.t:0 "The Army Returns Home"
 unification_war.5.d:0 "The ceasefire has restored every Free States territory. Emergency formations are being demobilized, leaving twenty permanent territorial divisions to defend the western compact. The war changed nothing on the map, but it proved that forced reunification would carry an unacceptable price."
 unification_war.5.a:0 "Demobilize to the twenty-division peacetime army."
 FSA_metal_wars_emergency_mobilization:0 "Metal Wars Emergency Mobilization"
 FSA_metal_wars_emergency_mobilization_desc:0 "The Free States have raised seventy emergency formations alongside their twenty permanent divisions. Local defense networks, dispersed logistics, and total mobilization make a rapid federal victory nearly impossible."
 metal_wars_stalemate_safeguard:0 "Metal Wars: No Surrender"
 metal_wars_stalemate_safeguard_desc:0 "Political leaders have forbidden capitulation while the limited Unification War remains unresolved. The conflict will end through the scripted ceasefire, not territorial conquest."
 corporate_global_operations:0 "Global Corporate Operations"
 corporate_global_operations_desc:0 "A sovereign or state-chartered megacorporation can finance industrial projects inside its host nation and recruit employees, specialists, contractors, and security personnel from the entire world."
 corporate_finance_host_civilian_industry:0 "Finance Host-Nation Industrial Park"
 corporate_finance_host_civilian_industry_desc:0 "Fund a new civilian industrial complex inside our host nation. The corporation pays the political and administrative cost, while the host government receives the factory and an additional building slot."
 corporate_finance_host_military_industry:0 "Finance Host-Nation Defense Plant"
 corporate_finance_host_military_industry_desc:0 "Establish a military manufacturing complex inside our host nation under a long-term corporate procurement contract."
 corporate_finance_host_shipbuilding:0 "Finance Host-Nation Shipyard"
 corporate_finance_host_shipbuilding_desc:0 "Develop a modern corporate shipyard in a coastal state belonging to our host nation."
 corporate_launch_global_recruitment_drive:0 "Launch Worldwide Recruitment Drive"
 corporate_launch_global_recruitment_drive_desc:0 "Recruit workers, technical specialists, mercenaries, veterans, and corporate citizens without regard to nationality. Completion immediately adds §G125,000§! manpower and maintains a worldwide recruitment pipeline for one year."
 corporate_global_recruitment_pipeline:0 "Worldwide Corporate Recruitment"
 corporate_global_recruitment_pipeline_desc:0 "Global offices, relocation packages, contractor citizenship, and private recruiting agencies allow the corporation to draw personnel from every continent.\n\nRecruitable Population Factor: §G+2.00%§!"

