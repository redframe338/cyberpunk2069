 MTC_cloud_computing_complex_modifier_desc:0 "Industrial software, cloud services, and automated logistics platforms are developed here."

 metacorp_technology_initiative:0 "MetaCorp Technology Initiative"
 metacorp_technology_initiative_desc:0 "Direct MetaCorp's investment in advanced civilian technology and digital infrastructure."
 federal_technology_policy:0 "Federal Technology Policy"
 federal_technology_policy_desc:0 "Balance civilian innovation, regulation, MetaCorp influence, and Militech's military-industrial power."

 MTC_expand_semiconductor_production:0 "Expand Semiconductor Production"
 MTC_expand_semiconductor_production_desc:0 "Construct another secure fabrication line and compete for federal processor contracts."
 MTC_construct_ai_laboratories:0 "Construct Additional AI Laboratories"
 MTC_construct_ai_laboratories_desc:0 "Expand the Boston AI institute with new computing clusters and specialist research teams."
 MTC_develop_quantum_computing:0 "Develop Quantum Computing"
 MTC_develop_quantum_computing_desc:0 "Commit extraordinary resources to a risky but potentially transformative computing program."
 MTC_expand_robotics_manufacturing:0 "Expand Robotics Manufacturing"
 MTC_expand_robotics_manufacturing_desc:0 "Increase production of autonomous industrial and security platforms."
 MTC_launch_national_cloud:0 "Launch National Cloud Infrastructure"
 MTC_launch_national_cloud_desc:0 "Link federal agencies, logistics systems, and major industries through a hardened continental cloud."
 MTC_expand_telecommunications:0 "Increase Telecommunications Coverage"
 MTC_expand_telecommunications_desc:0 "Modernize backbone links and extend secure high-bandwidth service."
 MTC_expand_consumer_electronics:0 "Expand Consumer Electronics Production"
 MTC_expand_consumer_electronics_desc:0 "Increase civilian electronics output for domestic consumption and export."
 MTC_increase_research_funding:0 "Increase Research Funding"
 MTC_increase_research_funding_desc:0 "Fund laboratories pursuing computing, electronics, and industrial automation."

 NUS_award_metacorp_contracts:0 "Award MetaCorp Technology Contracts"
 NUS_award_metacorp_contracts_desc:0 "Expand MetaCorp's federal role at the expense of Militech's political leverage."
 NUS_launch_semiconductor_initiative:0 "Launch National Semiconductor Initiative"
 NUS_launch_semiconductor_initiative_desc:0 "Secure domestic processor production and expand federal electronics research."
 NUS_expand_digital_infrastructure:0 "Expand Digital Infrastructure"
 NUS_expand_digital_infrastructure_desc:0 "Use MetaCorp platforms to modernize administration, commerce, and communications."
 NUS_strengthen_technology_regulation:0 "Strengthen Technology Regulation"
 NUS_strengthen_technology_regulation_desc:0 "Apply antitrust and security rules before MetaCorp becomes indispensable to the state."
 NUS_fund_military_ai:0 "Fund Joint Military AI"
 NUS_fund_military_ai_desc:0 "Order MetaCorp and Militech to cooperate on battlefield computing and autonomous logistics."
 NUS_balance_corporate_pillars:0 "Balance the Corporate Pillars"
 NUS_balance_corporate_pillars_desc:0 "Prevent either MetaCorp or Militech from gaining decisive influence over federal policy."

 metacorp.1.t:0 "The Civilian Technology Pillar"
 metacorp.1.d:0 "MetaCorp enters 2069 as the NUSA's indispensable civilian technology corporation. Its dispersed enclaves control semiconductor fabrication, artificial intelligence research, robotics, telecommunications, cloud infrastructure, and advanced electronics."
 metacorp.1.a:0 "Technology will rebuild the republic."
 metacorp.1.b:0 "Secure our position in Washington."
 metacorp.2.t:0 "Major AI Breakthrough"
 metacorp.2.d:0 "Researchers at the Artificial Intelligence Development Institute have demonstrated a new machine-learning architecture with applications throughout the economy."
 metacorp.2.a:0 "Expand the research program."
 metacorp.2.b:0 "Commercialize the discovery."
 metacorp.3.t:0 "Semiconductor Supply Crisis"
 metacorp.3.d:0 "A shortage of rare materials threatens fabrication schedules and federal technology contracts."
 metacorp.3.a:0 "Pay whatever is necessary to secure supply."
 metacorp.3.b:0 "Let the market absorb the shortage."
 metacorp.4.t:0 "Industrial Cyberattack"
 metacorp.4.d:0 "A coordinated intrusion has disrupted cloud services and attempted to steal sensitive processor designs."
 metacorp.4.a:0 "Harden every network."
 metacorp.4.b:0 "Conceal the scale of the breach."
 metacorp.5.t:0 "Autonomous Robotics Breakthrough"
 metacorp.5.d:0 "The robotics complex has completed a modular autonomous platform suitable for industry, infrastructure protection, and defense support."
 metacorp.5.a:0 "Expand production."
 metacorp.5.b:0 "License the platform."
 metacorp.6.t:0 "Federal Antitrust Investigation"
 metacorp.6.d:0 "Federal investigators argue that MetaCorp's control of processors, communications, and cloud infrastructure threatens civilian government."
 metacorp.6.a:0 "Accept limited oversight."
 metacorp.6.b:0 "Fight the investigation."
 metacorp.7.t:0 "The AI Ethics Debate"
 metacorp.7.d:0 "Scientists, legislators, and the public are divided over the limits that should govern increasingly capable autonomous systems."
 metacorp.7.a:0 "Adopt binding safeguards."
 metacorp.7.b:0 "Innovation cannot wait."
 metacorp.8.t:0 "Competition for Federal Research Grants"
 metacorp.8.d:0 "MetaCorp and Militech are lobbying for the same federal research budget. Supporting either corporation will reshape the balance of power in Washington."
 metacorp.8.a:0 "Fund MetaCorp's civilian technology program."
 metacorp.8.b:0 "Fund Militech's defense research."
 metacorp.8.c:0 "Split the appropriation."
