 MTC_telecommunications_center_modifier:0 "Telecommunications Operations Center"
 MTC_telecommunications_center_modifier_desc:0 "A secure communications nexus manages the continental network."
 MTC_quantum_computing_laboratory_modifier:0 "Quantum Computing Laboratory"
