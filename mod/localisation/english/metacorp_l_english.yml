 MTC_influence_digital_backbone:0 "Digital Infrastructure Backbone"
 MTC_influence_digital_backbone_desc:0 "MetaCorp platforms have become essential to federal administration and economic activity."
 MTC_influence_technology_giant:0 "Corporate Technology Giant"
 MTC_influence_technology_giant_desc:0 "Few civilian institutions can challenge MetaCorp's economic and political reach."
 MTC_influence_digital_state:0 "Digital State"
 MTC_influence_digital_state_desc:0 "MetaCorp functions as a state within the state, controlling the systems through which the NUSA operates."

