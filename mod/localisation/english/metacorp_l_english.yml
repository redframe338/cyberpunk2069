 MTC_semiconductor_superpower_desc:0 "Secure fabrication campuses manufacture the advanced processors required by the continental economy."
 MTC_artificial_intelligence_initiative:0 "Artificial Intelligence Initiative"
 MTC_artificial_intelligence_initiative_desc:0 "Massive computing clusters and specialist institutes accelerate machine intelligence and advanced software research."
 MTC_national_digital_infrastructure:0 "National Digital Infrastructure"
 MTC_national_digital_infrastructure_desc:0 "MetaCorp operates the cloud, communications, logistics software, and secure data links connecting the NUSA."
 NUS_metacorp_digital_dependency:0 "MetaCorp Digital Dependency"
 NUS_metacorp_digital_dependency_desc:0 "Federal reconstruction depends upon MetaCorp computing systems, processors, communications networks, and civilian technology."
