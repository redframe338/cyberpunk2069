l_english:
 petrochem_industrial_expansion:0 "PetroChem Industrial Expansion"
 petrochem_industrial_expansion_desc:0 "PetroChem is an NUSA-based energy and petrochemical corporation. Its refineries, chemical plants, pipelines, offshore platforms, and logistics network are managed through the federal corporate economy rather than represented as a separate territorial state.\n\n§YPetroChem Industrial Capacity:§! §G[?petrochem_industrial_capacity|0]§!/100\n§YCorporate Investment Points:§! §G[?petrochem_corporate_investment_points|0]§!\n\n§YBranches§!\nEnergy: [?petrochem_energy_investment|0]\nChemicals: [?petrochem_chemical_investment|0]\nSynthetic Fuels: [?petrochem_synthetic_investment|0]\nFertilizer: [?petrochem_fertilizer_investment|0]\nHydrogen: [?petrochem_hydrogen_investment|0]"
 petrochem_corporate_budget:0 "PetroChem Corporate Budget"
 petrochem_corporate_budget_desc:0 "PetroChem receives one NUSA corporate investment point each month, up to twenty. The board can allocate this capital between energy extraction, advanced materials, agricultural chemicals, research, and environmental remediation."

 petrochem_expand_offshore_drilling:0 "Expand Gulf and Atlantic Offshore Drilling"
 petrochem_expand_offshore_drilling_desc:0 "Fund offshore platforms, subsea pipelines, and support yards operated from Louisiana."
 petrochem_increase_refining_capacity:0 "Construct New NUSA Refineries"
 petrochem_increase_refining_capacity_desc:0 "Expand Louisiana's refinery and synthetic-fuel complex."
 petrochem_modernize_pipeline_infrastructure:0 "Modernize Pipeline Infrastructure"
 petrochem_modernize_pipeline_infrastructure_desc:0 "Turn Oklahoma into the central junction of PetroChem's NUSA pipeline system."
 petrochem_develop_synthetic_rubber:0 "Develop Synthetic Rubber and Fuel Facilities"
 petrochem_develop_synthetic_rubber_desc:0 "Build integrated synthetic-resource plants in Arkansas."
 petrochem_construct_hydrogen_plants:0 "Develop the Hydrogen Economy"
 petrochem_construct_hydrogen_plants_desc:0 "Construct advanced electrolysis, storage, and industrial hydrogen facilities around the Michigan research corridor."
 petrochem_expand_fertilizer_manufacturing:0 "Expand Fertilizer Manufacturing"
 petrochem_expand_fertilizer_manufacturing_desc:0 "Supply NUSA agriculture with dependable nitrogen fertilizers and industrial nutrients from Illinois."
 petrochem_upgrade_industrial_automation:0 "Automate Petrochemical Manufacturing"
 petrochem_upgrade_industrial_automation_desc:0 "Modernize chemical plants with predictive control systems and autonomous production lines."
 petrochem_increase_fuel_storage:0 "Construct a Strategic Fuel Reserve"
 petrochem_increase_fuel_storage_desc:0 "Build hardened storage facilities in Georgia for national emergencies."
 petrochem_expand_export_capacity:0 "Modernize LNG Export Terminals"
 petrochem_expand_export_capacity_desc:0 "Expand Atlantic liquefied-gas, chemical, and fuel-export capacity."
 petrochem_expand_polymer_production:0 "Expand Polymer Production"
 petrochem_expand_polymer_production_desc:0 "Increase production of military polymers, plastics, composites, and industrial feedstocks."
 petrochem_launch_continental_energy_initiative:0 "Launch the NUSA Energy Initiative"
 petrochem_launch_continental_energy_initiative_desc:0 "Integrate refineries, pipelines, synthetic fuels, storage, and logistics into a single NUSA system."
 petrochem_industrial_carbon_capture:0 "Industrial Carbon Capture Program"
 petrochem_industrial_carbon_capture_desc:0 "Build a PetroChem carbon-capture and industrial remediation network in New England."
 petrochem_global_recruitment_drive:0 "Launch PetroChem Worldwide Recruitment"
 petrochem_global_recruitment_drive_desc:0 "Use PetroChem offices, contractors, relocation packages, and technical recruiting agencies across the world. Completion adds §G75,000§! personnel to the NUSA manpower pool and activates a one-year corporate recruitment pipeline."
 petrochem_global_recruitment_pipeline:0 "PetroChem Worldwide Recruitment"
 petrochem_global_recruitment_pipeline_desc:0 "PetroChem's global hiring network draws workers, engineers, security contractors, and technical specialists into the NUSA-based corporation.\n\nRecruitable Population Factor: §G+0.50%§!"

 petrochem_allocate_budget_to_energy:0 "Prioritize PetroChem Energy Production"
 petrochem_allocate_budget_to_energy_desc:0 "Direct this budget cycle toward PetroChem's extraction, refining, and pipeline operations."
 petrochem_allocate_budget_to_pharma:0 "Prioritize Industrial Research"
 petrochem_allocate_budget_to_pharma_desc:0 "Fund advanced refining and chemical-process research."
 petrochem_allocate_budget_to_genetics:0 "Prioritize Advanced Materials"
 petrochem_allocate_budget_to_genetics_desc:0 "Fund computational chemistry, synthetic materials, and industrial electronics."
 petrochem_allocate_budget_to_agrisystem:0 "Prioritize Agricultural Chemicals"
 petrochem_allocate_budget_to_agrisystem_desc:0 "Fund fertilizer production and agricultural supply contracts across the NUSA."
 petrochem_allocate_budget_to_environment:0 "Prioritize Environmental Remediation"
 petrochem_allocate_budget_to_environment_desc:0 "Fund cleanup, carbon capture, and pollution control at PetroChem facilities."

 petrochem_capital_program:0 "PetroChem Capital Construction Program"
 petrochem_capital_program_desc:0 "Civilian production is temporarily committed to a major PetroChem investment."
 petrochem_regional_refinery_network:0 "Regional Refinery Network"
 petrochem_regional_refinery_network_desc:0 "PetroChem operates a limited but growing network of NUSA refineries."
 petrochem_national_energy_producer:0 "National Energy Producer"
 petrochem_national_energy_producer_desc:0 "PetroChem has become a major energy supplier within the NUSA."
 petrochem_continental_supplier:0 "Continental Petrochemical Supplier"
 petrochem_continental_supplier_desc:0 "PetroChem supplies fuel, chemicals, fertilizer, and feedstocks throughout the NUSA."
 petrochem_nusa_industrial_backbone:0 "NUSA Industrial Backbone"
 petrochem_nusa_industrial_backbone_desc:0 "NUSA infrastructure, logistics, and manufacturing increasingly depend on PetroChem."
 petrochem_strategic_energy_giant:0 "Strategic Energy Giant"
 petrochem_strategic_energy_giant_desc:0 "PetroChem anchors NUSA energy security and wartime industrial production."
 petrochem_global_petrochemical_leader:0 "Global Petrochemical Leader"
 petrochem_global_petrochemical_leader_desc:0 "PetroChem leads the world in integrated fuels, chemicals, hydrogen, and industrial logistics."
 petrochem_energy_production_branch:0 "NUSA Energy Network"
 petrochem_energy_production_branch_desc:0 "Dedicated investment has transformed extraction, refining, pipelines, and fuel logistics."
 petrochem_chemical_manufacturing_branch:0 "Continental Chemical Leader"
 petrochem_chemical_manufacturing_branch_desc:0 "PetroChem provides pharmaceuticals and heavy industry with advanced chemical feedstocks."
 petrochem_synthetic_fuels_branch:0 "Advanced Synthetic Fuel Economy"
 petrochem_synthetic_fuels_branch_desc:0 "Synthetic fuels and rubber insulate the NUSA from disrupted imports."
 petrochem_fertilizer_production_branch:0 "Integrated Fertilizer Production"
 petrochem_fertilizer_production_branch_desc:0 "PetroChem's fertilizer network strengthens NUSA agriculture and food security."
 petrochem_hydrogen_technologies_branch:0 "Hydrogen Transition"
 petrochem_hydrogen_technologies_branch_desc:0 "Advanced hydrogen systems support future industry and strategic infrastructure."
 petrochem_continental_energy_initiative_spirit:0 "NUSA Energy Initiative"
 petrochem_continental_energy_initiative_spirit_desc:0 "NUSA strategic energy infrastructure now operates as an integrated network."
 petrochem_pollution_penalties:0 "PetroChem Pollution Crisis"
 petrochem_pollution_penalties_desc:0 "Industrial contamination and public anger are disrupting the division's operations."
 petrochem_hydrogen_breakthrough_spirit:0 "Hydrogen Development Breakthrough"
 petrochem_hydrogen_breakthrough_spirit_desc:0 "A major technical breakthrough has accelerated clean industrial-energy research."

 petrochem_petrochemical_complex:0 "Petrochemical Complex"
 petrochem_petrochemical_complex_desc:0 "An integrated refinery and chemical-manufacturing complex dominates the local economy."
 petrochem_synthetic_fuel_plant:0 "Synthetic Fuel Plant"
 petrochem_synthetic_fuel_plant_desc:0 "This facility manufactures synthetic fuels, rubber, and strategic chemical feedstocks."
 petrochem_offshore_platform:0 "Offshore Platform Network"
 petrochem_offshore_platform_desc:0 "Offshore rigs, service yards, and subsea pipelines extract petroleum from difficult fields."
 petrochem_pipeline_junction:0 "Pipeline Junction"
 petrochem_pipeline_junction_desc:0 "NUSA fuel and chemical pipelines converge in this state."
 petrochem_chemical_manufacturing_hub:0 "Chemical Manufacturing Hub"
 petrochem_chemical_manufacturing_hub_desc:0 "Large chemical plants supply NUSA civilian and defense industries."
 petrochem_industrial_polymer_center:0 "Industrial Polymer Center"
 petrochem_industrial_polymer_center_desc:0 "Advanced polymers and composites support civilian and military manufacturing."
 petrochem_strategic_fuel_reserve:0 "Strategic Fuel Reserve"
 petrochem_strategic_fuel_reserve_desc:0 "Hardened storage protects NUSA fuel supplies from disruption."
 petrochem_hydrogen_research_campus:0 "Hydrogen Research Campus"
 petrochem_hydrogen_research_campus_desc:0 "Researchers develop advanced electrolysis, storage, and hydrogen infrastructure."
 petrochem_fertilizer_production_facility:0 "Fertilizer Production Facility"
 petrochem_fertilizer_production_facility_desc:0 "Industrial fertilizer production supports NUSA agriculture."
 petrochem_lng_export_terminal:0 "LNG Export Terminal"
 petrochem_lng_export_terminal_desc:0 "Modern port infrastructure handles liquefied gas, fuels, and chemical exports."
 petrochem_carbon_capture_network:0 "Industrial Carbon-Capture Network"
 petrochem_carbon_capture_network_desc:0 "Carbon capture, waste processing, and industrial remediation systems reduce the damage caused by PetroChem heavy industry."

 petrochem.1.t:0 "The PetroChem Network"
 petrochem.1.d:0 "PetroChem has consolidated its NUSA refineries, chemical plants, pipelines, offshore assets, and logistics contracts into a single national corporate network."
 petrochem.1.a:0 "Build an integrated NUSA energy network."
 petrochem.1.b:0 "Preserve capital for other federal priorities."
 petrochem.2.t:0 "New Offshore Oil Fields"
 petrochem.2.d:0 "PetroChem survey teams have identified commercially viable offshore reserves."
 petrochem.2.a:0 "Develop the fields immediately."
 petrochem.2.b:0 "License limited extraction."
 petrochem.3.t:0 "Major Refinery Accident"
 petrochem.3.d:0 "An explosion has damaged a major PetroChem refinery and exposed weaknesses in its safety systems."
 petrochem.3.a:0 "Finance a complete reconstruction."
 petrochem.3.b:0 "Contain the losses."
 petrochem.4.t:0 "Interstate Pipeline Explosion"
 petrochem.4.d:0 "A pipeline rupture has interrupted fuel deliveries and damaged nearby infrastructure."
 petrochem.4.a:0 "Replace the damaged network."
 petrochem.4.b:0 "Reroute supplies and accept disruption."
 petrochem.5.t:0 "Hydrogen Breakthrough"
 petrochem.5.d:0 "The Michigan research corridor has demonstrated a commercially viable advanced hydrogen process."
 petrochem.5.a:0 "Deploy it throughout PetroChem."
 petrochem.5.b:0 "License the patents."
 petrochem.6.t:0 "Chemical Spill"
 petrochem.6.d:0 "A serious chemical spill threatens public confidence in PetroChem and the NUSA industrial system."
 petrochem.6.a:0 "Mobilize federal cleanup teams."
 petrochem.6.b:0 "Protect the division from liability."
 petrochem.7.t:0 "Industrial Espionage"
 petrochem.7.d:0 "Foreign agents have attempted to steal PetroChem process designs and commercial data."
 petrochem.7.a:0 "Secure the research and continue development."
 petrochem.7.b:0 "Exploit the incident commercially."
 petrochem.8.t:0 "NUSA Energy Export Boom"
 petrochem.8.d:0 "Disrupted global supply has driven extraordinary demand for PetroChem exports."
 petrochem.8.a:0 "Maximize export revenue."
 petrochem.8.b:0 "Reserve production for the NUSA."
 petrochem.9.t:0 "NUSA Fuel Crisis"
 petrochem.9.d:0 "War and disrupted imports have placed severe pressure on the NUSA fuel system."
 petrochem.9.a:0 "Accelerate synthetic production."
 petrochem.9.b:0 "Ration fuel across the national network."
 petrochem.10.t:0 "Major Plastics Innovation"
 petrochem.10.d:0 "PetroChem engineers have developed a new family of high-performance industrial polymers."
 petrochem.10.a:0 "Integrate them into NUSA production."
 petrochem.10.b:0 "License the patents internationally."
 petrochem.11.t:0 "Industrial Automation Success"
 petrochem.11.d:0 "Automated control systems have substantially improved reliability throughout PetroChem."
 petrochem.11.a:0 "Expand automation across every facility."
 petrochem.11.b:0 "Convert the savings into dividends."
 petrochem.12.t:0 "International Environmental Pressure"
 petrochem.12.d:0 "NUSA regulators and international environmental groups demand stronger controls on PetroChem operations."
 petrochem.12.a:0 "Accept binding environmental safeguards."
 petrochem.12.b:0 "The industrial program must continue."

 # ---- PET (Petrochem Corporation) national ideas ----
 PET_petrochemical_dominance:0 "Petrochemical Dominance"
 PET_petrochemical_dominance_desc:0 "PetroChem's refineries, pipelines, and chemical plants make it the unchallenged energy backbone of the continent."
 PET_gulf_coast_refining_empire:0 "Gulf Coast Refining Empire"
 PET_gulf_coast_refining_empire_desc:0 "Louisiana's refinery complexes anchor PetroChem's entire continental supply chain."
 PET_federal_energy_contracts:0 "Federal Energy Contracts"
 PET_federal_energy_contracts_desc:0 "Long-term federal contracts guarantee PetroChem's markets, at the cost of federal oversight."
