 autonomy_strategic_state_corporation:0 "Strategic State Corporation"
 autonomy_strategic_state_corporation_desc:0 "A loyal state-owned combine that independently manages a strategic sector while remaining permanently subordinate to the Neo-Soviet Union."
 RULE_DESC_STRATEGIC_STATE_CORPORATION:0 "SovOil controls its internal budget, production, research, and security forces, but cannot declare independent wars, reject Union war orders, or advance toward independence."

