 SVO_national_energy_basin_modifier:0 "National Energy Basin"
 SVO_national_energy_basin_modifier_desc:0 "A dense complex of wells, pumping stations, pipelines, storage depots, and industrial support infrastructure."
 SVO_petrochemical_megacomplex_modifier:0 "Petrochemical Megacomplex"
 SVO_petrochemical_megacomplex_modifier_desc:0 "Refineries and chemical plants convert raw hydrocarbons into fuel, synthetic materials, and military feedstocks."
 SVO_arctic_energy_platform_modifier:0 "Arctic Energy Platform"
 SVO_arctic_energy_platform_modifier_desc:0 "Hardened extraction and logistics facilities operate in extreme northern conditions."
 SVO_pipeline_administration_modifier:0 "Pipeline Administration Zone"
 SVO_pipeline_administration_modifier_desc:0 "This district coordinates strategic pipeline flows, repairs, storage, and continental fuel distribution."

 SVO_energy_superpower:0 "Energy Superpower"
 SVO_energy_superpower_desc:0 "SovOil commands one of the largest integrated hydrocarbon systems on Earth."
 SVO_elite_energy_guard:0 "Elite Energy Guard"
 SVO_elite_energy_guard_desc:0 "SovOil's compact army is built around veteran mechanized security formations and Arctic assault troops. It fields fewer divisions than the Neo-Soviet Union, but every formation receives superior equipment, training, logistics, and corporate combat support."
 SVO_state_industrial_combine:0 "State Industrial Combine"
 SVO_state_industrial_combine_desc:0 "State ownership and corporate management are fused into a disciplined industrial apparatus."
 SVO_soviet_energy_monopoly:0 "Soviet Energy Monopoly"
 SVO_soviet_energy_monopoly_desc:0 "Control over exports and domestic supply gives SovOil immense economic leverage."
 SVO_arctic_resource_network:0 "Arctic Resource Network"
 SVO_arctic_resource_network_desc:0 "Northern roads, ports, airfields, and pipelines sustain extraction in the harshest regions of the Union."
 SVO_loyal_union_instrument:0 "Loyal Instrument of the Union"
 SVO_loyal_union_instrument_desc:0 "SovOil is not a rival corporate state. It is a loyal strategic arm of the Neo-Soviet Union, administering energy territory and security forces in service of Union policy. Its separate charter grants operational flexibility, not political independence."
 USR_sovoil_energy_dividend:0 "SovOil Energy Dividend"
 USR_sovoil_energy_dividend_desc:0 "Fuel, export revenue, and industrial coordination from SovOil support the wider Neo-Soviet economy."
 SVO_wartime_energy_mobilization:0 "Wartime Energy Mobilization"
 SVO_wartime_energy_mobilization_desc:0 "Civilian flexibility has been sacrificed to maximize fuel and military-industrial output."
 SVO_energy_crisis:0 "Energy Crisis"
 SVO_energy_crisis_desc:0 "Disrupted infrastructure and institutional failures are reducing production across the network."

 SVO_influence_agency:0 "Administrative Agency"
 SVO_influence_agency_desc:0 "SovOil operates as a tightly supervised department of state."
 SVO_influence_combine:0 "Major Industrial Combine"
 SVO_influence_combine_desc:0 "SovOil is an important producer but remains politically constrained."
 SVO_influence_pillar:0 "Strategic Economic Pillar"
 SVO_influence_pillar_desc:0 "The Union depends on SovOil for fuel, revenue, logistics, and industrial planning."
 SVO_influence_power_center:0 "Political Power Center"
 SVO_influence_power_center_desc:0 "SovOil executives now influence national priorities beyond the energy sector."
 SVO_influence_directorate:0 "Energy Directorate"
 SVO_influence_directorate_desc:0 "The combine functions as a state institution nearly equal to major ministries."
 SVO_influence_energy_state:0 "Energy State"
 SVO_influence_energy_state_desc:0 "The state remains sovereign, but its economy and government have become inseparable from SovOil."

 sovoil_development_program:0 "SovOil Development Program"
 sovoil_development_program_desc:0 "Expand extraction, refining, storage, exports, and the logistics network that sustains the Union."
 soviet_state_energy_policy:0 "Soviet State Energy Policy"
 soviet_state_energy_policy_desc:0 "Define the balance between state control, energy revenue, military requirements, and SovOil's operational authority."

 SVO_expand_arctic_extraction:0 "Expand Arctic Extraction"
 SVO_expand_arctic_extraction_desc:0 "Deploy new drilling systems and hardened support infrastructure across Yamal."
 SVO_construct_pipeline_network:0 "Construct New Pipeline Network"
 SVO_construct_pipeline_network_desc:0 "Increase the resilience and capacity of the continental distribution system."
 SVO_modernize_petrochemical_facilities:0 "Modernize Petrochemical Facilities"
 SVO_modernize_petrochemical_facilities_desc:0 "Rebuild the Volga complex around automated military-grade production."
 SVO_increase_strategic_reserves:0 "Increase Strategic Reserves"
 SVO_increase_strategic_reserves_desc:0 "Expand protected fuel storage for national emergencies."
 SVO_open_siberian_fields:0 "Open New Siberian Fields"
 SVO_open_siberian_fields_desc:0 "Exploit newly surveyed deposits around the western Siberian network."
 SVO_expand_lng_infrastructure:0 "Expand LNG Infrastructure"
 SVO_expand_lng_infrastructure_desc:0 "Build liquefaction, storage, and handling facilities for northern gas exports."
 SVO_upgrade_export_terminals:0 "Upgrade Export Terminals"
 SVO_upgrade_export_terminals_desc:0 "Modernize Arctic ports for year-round energy shipments."
 SVO_develop_offshore_platforms:0 "Develop Offshore Platforms"
 SVO_develop_offshore_platforms_desc:0 "Commit major capital to offshore Arctic extraction."
 SVO_increase_domestic_refining:0 "Increase Domestic Refining"
 SVO_increase_domestic_refining_desc:0 "Expand domestic refining to reduce dependence on vulnerable processing centers."
 SVO_automate_extraction:0 "Automate Extraction Operations"
 SVO_automate_extraction_desc:0 "Integrate autonomous machinery and cybernetic control into the production network."

 USR_increase_state_oversight:0 "Increase State Oversight"
 USR_increase_state_oversight_desc:0 "Expand ministerial auditing and reduce SovOil's freedom of action."
 USR_grant_corporate_authority:0 "Grant Greater Corporate Authority"
 USR_grant_corporate_authority_desc:0 "Allow SovOil management greater freedom to respond to strategic demand."
 USR_launch_national_energy_initiative:0 "Launch National Energy Initiative"
 USR_launch_national_energy_initiative_desc:0 "Coordinate Union ministries and SovOil around a single development program."
 USR_combat_sovoil_corruption:0 "Combat Corruption"
 USR_combat_sovoil_corruption_desc:0 "Investigate procurement networks and remove officials exploiting the energy monopoly."
 USR_redirect_energy_revenues:0 "Redirect Energy Revenues"
 USR_redirect_energy_revenues_desc:0 "Transfer a larger share of export earnings into the federal budget."
 USR_expand_civilian_infrastructure:0 "Expand Civilian Infrastructure"
 USR_expand_civilian_infrastructure_desc:0 "Use the energy network to improve transport and services beyond extraction districts."
 USR_increase_military_fuel_stockpiles:0 "Increase Military Fuel Stockpiles"
 USR_increase_military_fuel_stockpiles_desc:0 "Order SovOil to prioritize the armed forces and strategic reserves."
 USR_national_industrial_expansion:0 "National Industrial Expansion"
 USR_national_industrial_expansion_desc:0 "Integrate refineries and petrochemical plants into a broader industrial mobilization program."
 USR_full_state_integration:0 "Formalize SovOil's Permanent Charter"
 USR_full_state_integration_desc:0 "Codify SovOil's permanent loyalty and subordination while preserving it as a separate strategic state corporation within the Neo-Soviet Union."

 sovoil.1.t:0 "The State Energy Combine"
 sovoil.1.d:0 "SovOil is neither a private empire nor an ordinary ministry. It is the Union's state-owned energy combine: legally subordinate to Moscow, operationally autonomous, and responsible for the fuel network that holds Eurasia together."
 sovoil.1.a:0 "Energy serves the Union"
 sovoil.1.b:0 "The combine requires room to operate"
 sovoil.2.t:0 "The Annual Energy Directive"
 sovoil.2.d:0 "The Union government has issued its annual strategic directive. Management must choose between maximizing export revenue and emphasizing domestic stability."
 sovoil.2.a:0 "Prioritize strategic exports"
 sovoil.2.b:0 "Guarantee domestic supply"
 sovoil.3.t:0 "New Fields in Western Siberia"
 sovoil.3.d:0 "Survey teams have identified commercially viable deposits connected to the western Siberian network."
 sovoil.3.a:0 "Begin immediate development"
 sovoil.3.b:0 "Reserve the deposits for the future"
 sovoil.4.t:0 "Pipeline Sabotage"
 sovoil.4.d:0 "Explosions have damaged a strategic pipeline segment. Whether caused by separatists, foreign agents, or criminal negligence, the interruption demands a response."
 sovoil.4.a:0 "Fund emergency repairs and security"
 sovoil.4.b:0 "Expose the failure and accept the consequences"
 sovoil.5.t:0 "Arctic Expansion Program"
 sovoil.5.d:0 "Engineers propose a major northern expansion connecting Yamal and the offshore platforms into a unified extraction system."
 sovoil.5.a:0 "Build the northern network"
 sovoil.5.b:0 "The capital cost is excessive"
 sovoil.6.t:0 "Corruption Investigation"
 sovoil.6.d:0 "Federal investigators have uncovered procurement fraud and patronage networks inside the combine."
 sovoil.6.a:0 "Purge the corrupt directorates"
 sovoil.6.b:0 "Protect management from political disruption"
 sovoil.7.t:0 "Continental Export Negotiations"
 sovoil.7.d:0 "Foreign governments seek long-term energy contracts. The terms promise revenue but may tighten their dependence on SovOil."
 sovoil.7.a:0 "Use exports as strategic leverage"
 sovoil.7.b:0 "Secure affordable domestic energy first"
 sovoil.8.t:0 "Automated Extraction Breakthrough"
 sovoil.8.d:0 "A new generation of autonomous drilling and network-control systems could transform production."
 sovoil.8.a:0 "Fund a permanent research directorate"
 sovoil.8.b:0 "Apply the technology directly to industry"
 sovoil.9.t:0 "Environmental Disaster"
 sovoil.9.d:0 "A major spill has contaminated an extraction district and interrupted regional production."
 sovoil.9.a:0 "Pay for containment and restoration"
 sovoil.9.b:0 "Conceal the scale of the disaster"
 sovoil.10.t:0 "Military Fuel Emergency"
 sovoil.10.d:0 "The Union is at war. The armed forces demand immediate priority over exports and civilian consumption."
 sovoil.10.a:0 "Mobilize the entire energy system"
 sovoil.10.b:0 "Preserve civilian and export commitments"
 sovoil.11.t:0 "The Permanent Union Charter"
 sovoil.11.d:0 "The Union government has issued a permanent charter defining SovOil as a loyal strategic state corporation. SovOil retains its separate administration, industrial system, territory, and security forces, but recognizes that all of them exist to serve Neo-Soviet strategy."
 sovoil.11.a:0 "SovOil serves the Union"
