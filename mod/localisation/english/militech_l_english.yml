 MLT_national_defense_headquarters_modifier:0 "National Defense Headquarters"
 MLT_national_defense_headquarters_modifier_desc:0 "A fortified command district coordinating federal contracts, strategic planning, and Militech operations."
 MLT_advanced_weapons_laboratory_modifier:0 "Advanced Weapons Laboratory"
 MLT_advanced_weapons_laboratory_modifier_desc:0 "Restricted laboratories develop next-generation armor, electronics, infantry weapons, and autonomous systems."
 MLT_military_industrial_complex_modifier:0 "Military Industrial Complex"
 MLT_military_industrial_complex_modifier_desc:0 "Automated production lines manufacture advanced weapons and military systems at enormous scale."
 MLT_strategic_logistics_command_modifier:0 "Strategic Logistics Command"
 MLT_strategic_logistics_command_modifier_desc:0 "A hardened logistics network controls supply, fuel distribution, overseas transport, and deployment."
 MLT_military_testing_grounds_modifier:0 "Military Testing Grounds"
 MLT_military_testing_grounds_modifier_desc:0 "Remote ranges support weapons trials, doctrine development, and elite formation training."

 MLT_military_industrial_titan:0 "Military Industrial Titan"
 MLT_military_industrial_titan_desc:0 "Militech is the central manufacturing pillar of the NUSA war machine."
 MLT_private_army_doctrine:0 "Private Army Doctrine"
 MLT_private_army_doctrine_desc:0 "Professional corporate formations emphasize mobility, organization, combined arms, and operational initiative."
 MLT_apex_infantry_system:0 "Apex Infantry System"
 MLT_apex_infantry_system_desc:0 "Militech integrates advanced weapons, battlefield computing, corporate logistics, veteran cadres, and overwhelming fire support into the most capable infantry formations in the world."
 MLT_advanced_weapons_development:0 "Advanced Weapons Development"
 MLT_advanced_weapons_development_desc:0 "Corporate laboratories pursue armor, aircraft, battlefield computing, robotics, and advanced infantry systems."
 MLT_federal_defense_contracts:0 "Federal Defense Contracts"
 MLT_federal_defense_contracts_desc:0 "Federal procurement provides money and stability while tying Militech closely to Washington."
 NUS_militech_defense_dependency:0 "Militech Defense Dependency"
 NUS_militech_defense_dependency_desc:0 "The federal military relies on Militech equipment, logistics, and technical expertise."
 MLT_emergency_defense_mobilization:0 "Emergency Defense Mobilization"
 MLT_emergency_defense_mobilization_desc:0 "Commercial flexibility has been sacrificed to satisfy urgent federal military requirements."
 MLT_defense_reform_restrictions:0 "Federal Defense Restrictions"
 MLT_defense_reform_restrictions_desc:0 "New oversight rules restrict Militech procurement, political activity, and independent expansion."

 MLT_influence_contractor:0 "Standard Contractor"
 MLT_influence_contractor_desc:0 "Militech is treated as one defense supplier among many."
 MLT_influence_supplier:0 "Preferred Supplier"
 MLT_influence_supplier_desc:0 "Militech receives privileged access to federal procurement."
 MLT_influence_partner:0 "National Defense Partner"
 MLT_influence_partner_desc:0 "Federal strategy and Militech planning have become deeply interconnected."
 MLT_influence_institution:0 "Strategic Military Institution"
 MLT_influence_institution_desc:0 "Militech functions as a permanent pillar of the national defense establishment."
 MLT_influence_power_broker:0 "Federal Power Broker"
 MLT_influence_power_broker_desc:0 "Corporate generals and executives can shape federal military and political priorities."
 MLT_influence_military_government:0 "Military Government"
 MLT_influence_military_government_desc:0 "Militech possesses enough power to determine who governs the NUSA."

 militech_corporate_operations:0 "Militech Corporate Operations"
 militech_corporate_operations_desc:0 "Expand conventional military production, research, recruitment, logistics, and federal influence."
 federal_defense_policy:0 "Federal Defense Policy"
 federal_defense_policy_desc:0 "Manage the benefits and dangers created by federal dependence on Militech."

 MLT_expand_weapons_production:0 "Expand Weapons Production"
 MLT_expand_weapons_production_desc:0 "Add new automated armament lines to the Tennessee industrial zone."
 MLT_acquire_defense_contractors:0 "Acquire Defense Contractors"
 MLT_acquire_defense_contractors_desc:0 "Purchase smaller suppliers and consolidate the federal defense market."
 MLT_develop_next_generation_armor:0 "Develop Next Generation Armor"
 MLT_develop_next_generation_armor_desc:0 "Fund a new family of advanced armored combat platforms."
 MLT_expand_drone_manufacturing:0 "Expand Drone Manufacturing"
 MLT_expand_drone_manufacturing_desc:0 "Increase production capacity for autonomous battlefield systems."
 MLT_increase_pmc_recruitment:0 "Increase PMC Recruitment"
 MLT_increase_pmc_recruitment_desc:0 "Recruit veterans and technical specialists into Militech service."
 MLT_build_research_centers:0 "Build New Military Research Centers"
 MLT_build_research_centers_desc:0 "Establish a permanent network of restricted weapons laboratories."
 MLT_modernize_aerospace_division:0 "Modernize Aerospace Division"
 MLT_modernize_aerospace_division_desc:0 "Upgrade aerospace research, testing, and security infrastructure."
 MLT_expand_logistics_infrastructure:0 "Expand Logistics Infrastructure"
 MLT_expand_logistics_infrastructure_desc:0 "Improve continental supply routes and Pacific deployment capacity."
 MLT_fund_special_operations:0 "Fund Special Operations"
 MLT_fund_special_operations_desc:0 "Expand black operations, airborne forces, and rapid-response units."
 MLT_increase_weapons_exports:0 "Increase Weapons Exports"
 MLT_increase_weapons_exports_desc:0 "Sell Militech systems abroad to gain revenue and strategic influence."
 MLT_declare_corporate_independence:0 "Declare Corporate Independence"
 MLT_declare_corporate_independence_desc:0 "Exploit a federal constitutional crisis to end NUSA authority over Militech."
 MLT_prepare_military_government:0 "Prepare a Military Government"
 MLT_prepare_military_government_desc:0 "Use our dominance of national defense to install a military-backed federal administration."

 NUS_award_additional_contracts:0 "Award Additional Contracts"
 NUS_award_additional_contracts_desc:0 "Expand Militech procurement to meet immediate federal defense requirements."
 NUS_increase_militech_oversight:0 "Increase Oversight"
 NUS_increase_militech_oversight_desc:0 "Place federal inspectors and officers inside Militech programs."
 NUS_expand_federal_procurement:0 "Expand Federal Procurement"
 NUS_expand_federal_procurement_desc:0 "Purchase additional weapons and support systems from Militech."
 NUS_launch_military_modernization:0 "Launch Military Modernization"
 NUS_launch_military_modernization_desc:0 "Coordinate federal forces and Militech around a new modernization program."
 NUS_reduce_corporate_influence:0 "Reduce Corporate Influence"
 NUS_reduce_corporate_influence_desc:0 "Use legislation and procurement reform to limit Militech's political reach."
 NUS_strengthen_federal_command:0 "Strengthen Federal Command"
 NUS_strengthen_federal_command_desc:0 "Restore federal officers' authority over national military planning."
 NUS_investigate_procurement_corruption:0 "Investigate Procurement Corruption"
 NUS_investigate_procurement_corruption_desc:0 "Expose kickbacks, black budgets, and improper corporate influence."
 NUS_national_defense_initiative:0 "National Defense Initiative"
 NUS_national_defense_initiative_desc:0 "Mobilize federal and corporate institutions around national reconstruction."
 NUS_emergency_defense_mobilization:0 "Emergency Defense Mobilization"
 NUS_emergency_defense_mobilization_desc:0 "Order Militech to prioritize federal wartime requirements."
 NUS_nationalize_militech:0 "Nationalize Militech"
 NUS_nationalize_militech_desc:0 "Absorb a weakened Militech directly into the federal defense establishment."

 militech.1.t:0 "The Corporate Army"
 militech.1.d:0 "Militech is both the NUSA's leading defense contractor and a semi-autonomous military institution. Its factories, laboratories, bases, and professional forces form the backbone of federal power."
 militech.1.a:0 "Militech serves the national defense"
 militech.1.b:0 "Operational autonomy guarantees effectiveness"
 militech.2.t:0 "Congressional Defense Debate"
 militech.2.d:0 "Federal legislators are debating whether to expand Militech contracts or strengthen civilian oversight."
 militech.2.a:0 "Lobby for expanded contracts"
 militech.2.b:0 "Accept transparent federal oversight"
 militech.3.t:0 "Advanced Weapons Demonstration"
 militech.3.d:0 "A successful live-fire demonstration has impressed federal commanders and foreign observers."
 militech.3.a:0 "Demonstrate full combat capability"
 militech.3.b:0 "Turn the demonstration into a sales event"
 militech.4.t:0 "Foreign Military Sales"
 militech.4.d:0 "Several governments seek access to Militech weapons, training, and logistics systems."
 militech.4.a:0 "Expand strategic exports"
 militech.4.b:0 "Prioritize federal requirements"
 militech.5.t:0 "The Black Budget Program"
 militech.5.d:0 "A classified development program requests major funding outside ordinary federal procurement channels."
 militech.5.a:0 "Fund the classified laboratories"
 militech.5.b:0 "Move the technology into production"
 militech.6.t:0 "Procurement Corruption Investigation"
 militech.6.d:0 "Federal investigators have uncovered kickbacks and concealed contract arrangements."
 militech.6.a:0 "Purge the compromised executives"
 militech.6.b:0 "Protect the corporate chain of command"
 militech.7.t:0 "Corporate Espionage"
 militech.7.d:0 "Security teams have detected an attempt to penetrate a restricted weapons program."
 militech.7.a:0 "Launch an aggressive counter-operation"
 militech.7.b:0 "Contain the breach quietly"
 militech.8.t:0 "Autonomous Warfare Breakthrough"
 militech.8.d:0 "Engineers have demonstrated an AI-assisted drone coordination system suitable for battlefield deployment."
 militech.8.a:0 "Expand autonomous-systems research"
 militech.8.b:0 "Begin immediate mass production"
 militech.9.t:0 "Special Operations Mission"
 militech.9.d:0 "A high-risk operation offers an opportunity to demonstrate Militech's unique capabilities."
 militech.9.a:0 "Authorize the mission"
 militech.9.b:0 "The political risk is excessive"
 militech.10.t:0 "Federal Military Emergency"
 militech.10.d:0 "The NUSA is at war and demands immediate access to Militech production, logistics, and combat forces."
 militech.10.a:0 "Mobilize for federal victory"
 militech.10.b:0 "Protect corporate operational commitments"
 militech.11.t:0 "The Corporate Declaration"
 militech.11.d:0 "Federal authority is collapsing. Militech can terminate its charter and declare itself a sovereign corporate military state."
 militech.11.a:0 "Declare complete independence"
 militech.11.b:0 "Preserve the federal partnership"
 militech.12.t:0 "The Military Ultimatum"
 militech.12.d:0 "Militech commanders demand the formation of a military-backed administration to restore order and national defense."
 militech.12.a:0 "Accept the emergency military government"
 militech.12.b:0 "Civilian government will resist"
 militech.13.t:0 "Federal Nationalization Directive"
 militech.13.d:0 "The NUSA government has ordered Militech's separate charter dissolved and its assets integrated into the federal military."
 militech.13.a:0 "Comply with nationalization"
 militech.13.b:0 "Defend the corporate charter"
