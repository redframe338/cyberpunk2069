 autonomy_strategic_defense_corporation:0 "Strategic Defense Corporation"
 autonomy_strategic_defense_corporation_desc:0 "A federally chartered military corporation with independent production, research, armed forces, operational command, and authority to wage corporate wars."
 RULE_DESC_STRATEGIC_DEFENSE_CORPORATION:0 "Militech maintains its own command structure and defense industry but remains aligned with NUSA strategic planning and cannot freely wage war."

