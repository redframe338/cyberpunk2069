 autonomy_integrated_scientific_corporation:0 "Integrated Scientific Corporation"
 autonomy_integrated_scientific_corporation_desc:0 "A directly controlled strategic scientific authority whose diplomacy, security policy, and industrial priorities are determined by its sovereign government."
 RULE_DESC_INTEGRATED_SCIENTIFIC_CORPORATION:0 "This corporation cannot create factions or freely gain autonomy, but its charter permits independent corporate warfare against rival megacorporations. Most of its strategic output supports its EEC sovereign."

