 # SOVIET EMPIRE PATH — Localisation
 # ================================================================

 # ---- Tooltips ----
 USR_imperial_current_tt:0 "§YThe Imperial Current§! — Soviet Imperial Influence tracking begins. A secret faction now works to restore the Union's continental supremacy."
 USR_party_captured_tt:0 "§YThe Party is under control.§! The Supreme Soviet will vote as directed."
 USR_military_captured_tt:0 "§YThe armed forces are secured.§! The Moscow Military District awaits its orders."
 USR_security_captured_tt:0 "§YState security answers to the Committee.§! Opposition has been silenced."
 USR_economy_captured_tt:0 "§YStrategic industries are subordinated.§! Neither SovOil nor Gazprom can resist."
 USR_emergency_session_tt:0 "§YThe Emergency Session is called.§! Marshal Voronin will address the Supreme Soviet."
 USR_coup_without_gunfire_tt:0 "§YThe coup succeeds without a single shot.§! Every institution capable of resistance has already been captured. SovOil and Gazprom are absorbed into the state."
 USR_proclaim_soviet_empire_tt:0 "§YThe Soviet Empire is proclaimed.§! The Neo-Soviet Union is reorganized as a centralized imperial state under Chairman Voronin."
 POLITICS_VORONIN_DESC:0 "Marshal Alexei Voronin served forty years in Soviet military intelligence before concluding that socialism cannot survive without continental military supremacy. He does not call himself an emperor. 'Empire' describes the state's organization and ambitions, not a monarchy."

 # ---- Conspiracy Spine Focuses ----
 USR_imperial_current:0 "The Imperial Current"
 USR_imperial_current_desc:0 "A faction inside the Party argues that the Union's weakness comes from federal compromise, civilian indecision, and the abandonment of great-power ambition. They do not seek reform. They seek restoration—of discipline, of purpose, of empire."
 USR_veterans_lost_superpower:0 "Veterans of the Lost Superpower"
 USR_veterans_lost_superpower_desc:0 "Military veterans, industrial managers, and former intelligence officials rally to the cause. They remember when the Union was feared. They intend to make it feared again."
 USR_committee_soviet_restoration:0 "The Committee for Soviet Restoration"
 USR_committee_soviet_restoration_desc:0 "Marshal Alexei Voronin formalizes the conspiracy as a secret committee. Its cells operate in every ministry, every garrison, every republic. The takeover will be silent, institutional, and irreversible."

 # ---- Party Takeover Branch ----
 USR_place_loyalists_party:0 "Place Loyalists in the Party"
 USR_place_loyalists_party_desc:0 "Committee agents are appointed to key party positions across the republics. They report to Voronin, not the Presidium."
 USR_control_appointment_committees:0 "Control the Appointment Committees"
 USR_control_appointment_committees_desc:0 "Personnel decisions—who rises, who is transferred, who is investigated—now pass through Committee loyalists. The party's own bureaucracy becomes the instrument of its capture."
 USR_discredit_reformist_bloc:0 "Discredit the Reformist Bloc"
 USR_discredit_reformist_bloc_desc:0 "Leaked documents, fabricated scandals, and genuine corruption cases destroy the reformists' credibility. The moderates lose their audience."
 USR_remove_republican_delegates:0 "Remove the Republican Delegates"
 USR_remove_republican_delegates_desc:0 "Republican representatives who resist centralization are recalled, replaced, or quietly arrested. The Supreme Soviet grows more compliant with every empty seat."
 USR_control_the_presidium:0 "Control the Presidium"
 USR_control_the_presidium_desc:0 "The Presidium's membership now reflects the Committee's will. Every motion, every vote, every emergency decree will pass without meaningful opposition."
 USR_majority_behind_closed_doors:0 "A Majority Behind Closed Doors"
 USR_majority_behind_closed_doors_desc:0 "The final count is conducted in private. Two-thirds of the Supreme Soviet will vote for emergency powers when the time comes. Some believe in the cause. Most are afraid."

 # ---- Military Takeover Branch ----
 USR_marshals_circle:0 "The Marshal's Circle"
 USR_marshals_circle_desc:0 "Senior commanders who share Voronin's vision form an inner circle. They control the strategic rocket forces, the Moscow garrison, and the military intelligence directorate."
 USR_veterans_before_politicians:0 "Veterans Before Politicians"
 USR_veterans_before_politicians_desc:0 "The Committee funds veterans' organizations, rehabilitation centers, and military families. Every soldier and officer receives the message: the army has been betrayed by civilian politicians."
 USR_promote_imperial_officers_se:0 "Promote the Imperial Officers"
 USR_promote_imperial_officers_se_desc:0 "Loyalist officers receive accelerated promotion. Unreliable commanders are transferred to remote postings in Siberia and Central Asia."
 USR_restore_political_commissars:0 "Restore Political Commissars"
 USR_restore_political_commissars_desc:0 "The Committee reintroduces political officers into every division. They report directly to the Committee for Soviet Restoration, not the civilian government."
 USR_secure_moscow_military_district:0 "Secure the Moscow Military District"
 USR_secure_moscow_military_district_desc:0 "The Moscow garrison, the Kremlin guard, and the capital's air defense network are placed under direct Committee command. When the order comes, the capital will be locked down within hours."
 USR_army_awaits_orders:0 "The Army Awaits Its Orders"
 USR_army_awaits_orders_desc:0 "Every division commander has received sealed instructions. The military will surround government buildings during the emergency session but will not begin fighting. There will be no civil war because there will be no resistance."

 # ---- Security Takeover Branch ----
 USR_reorganize_state_security_se:0 "Reorganize State Security"
 USR_reorganize_state_security_se_desc:0 "The security apparatus is restructured under Committee oversight. New directorates are created for internal surveillance, counterintelligence, and political reliability."
 USR_directorate_imperial_unity:0 "The Directorate of Imperial Unity"
 USR_directorate_imperial_unity_desc:0 "A new security organ—officially tasked with counterespionage—monitors every delegate, every minister, every republican governor. Its real purpose is coup security."
 USR_files_every_delegate:0 "Files on Every Delegate"
 USR_files_every_delegate_desc:0 "The Directorate compiles comprehensive dossiers on every member of the Supreme Soviet. Financial irregularities, personal scandals, family connections—everyone has something to hide."
 USR_intercept_republican_comms:0 "Intercept Republican Communications"
 USR_intercept_republican_comms_desc:0 "Republican governments discover that their secure communications have been compromised. Orders from Moscow arrive before their own messages do."
 USR_arrest_democratic_organizers:0 "Arrest the Democratic Organizers"
 USR_arrest_democratic_organizers_desc:0 "Underground democratic movements, labor organizers, and independent journalists disappear in coordinated raids. The streets fall silent."
 USR_silence_the_federalists:0 "Silence the Federalists"
 USR_silence_the_federalists_desc:0 "The last organized opposition is dismantled. Federalist politicians are detained, exiled, or placed under permanent surveillance. No one will call for resistance when the emergency session begins."

 # ---- Economic Takeover Branch ----
 USR_control_strategic_ministries:0 "Control the Strategic Ministries"
 USR_control_strategic_ministries_desc:0 "The ministries of energy, defense industry, heavy manufacturing, and transportation are placed under Committee administrators. The civilian economy begins its subordination to military planning."
 USR_directive_economy:0 "A Directive Economy"
 USR_directive_economy_desc:0 "Economic planning returns to centralized directives. Production quotas, resource allocation, and investment priorities are set by the Committee, not the market."
 USR_subordinate_gazprom_se:0 "Subordinate Gazprom"
 USR_subordinate_gazprom_se_desc:0 "Gazprom's board is informed that their corporation now operates under state directive. Their gas networks are strategic infrastructure, not private assets."
 USR_freeze_corporate_donations:0 "Freeze Corporate Political Donations"
 USR_freeze_corporate_donations_desc:0 "All corporate political financing is prohibited. Energy companies can no longer fund opposition parties, buy delegates, or maintain private lobbying operations."
 USR_break_sovoil_autonomy_se:0 "Break SovOil's Autonomy"
 USR_break_sovoil_autonomy_se_desc:0 "SovOil's corporate charter is revoked. Its Energy Guard is ordered to stand down. Its territorial governors are replaced with Committee appointees. The petroleum empire answers to Moscow."
 USR_fuel_belongs_to_state:0 "Fuel Belongs to the State"
 USR_fuel_belongs_to_state_desc:0 "The final economic prerequisite is met. Neither SovOil nor Gazprom can organize resistance, fund opposition, or maintain independent military forces. All fuel serves the state."

 # ---- The Coup ----
 USR_emergency_session:0 "The Emergency Session"
 USR_emergency_session_desc:0 "Marshal Voronin addresses the Supreme Soviet. Foreign interference, separatism, and corporate sabotage have created a national emergency. The constitution must be suspended. An Imperial Presidium must be created. The republics must be centralized. Strategic corporations must be nationalized. The delegates will vote. The army is already in position."
 USR_coup_without_gunfire:0 "The Coup Without Gunfire"
 USR_coup_without_gunfire_desc:0 "The capital is occupied quietly. Loyal soldiers guard government buildings. State security detains opposition leaders. Communications are placed under military control. Gazprom maintains civilian energy supplies. SovOil's Energy Guard is ordered to disarm. The Supreme Soviet formally votes itself out of power. There is no civil war because every institution capable of resisting has already been captured."

 # ---- Post-Coup Transition ----
 USR_se_imperial_presidium:0 "The Imperial Presidium"
 USR_se_imperial_presidium_desc:0 "Chairman Voronin establishes the Imperial Presidium as the supreme governing body. Military commanders, security chiefs, and loyal party administrators replace the old civilian leadership."
 USR_end_federal_experiment:0 "End the Federal Experiment"
 USR_end_federal_experiment_desc:0 "The union republics are stripped of their constitutional autonomy. Republican governments are dissolved and replaced with centrally appointed administrators."
 USR_republics_administrative_units:0 "Republics Are Administrative Units"
 USR_republics_administrative_units_desc:0 "The former republics retain their names and cultural institutions but lose all political independence. They are administrative divisions of a unitary state, nothing more."
 USR_empire_workers_soldiers:0 "An Empire of Workers and Soldiers"
 USR_empire_workers_soldiers_desc:0 "The new state ideology is articulated: Soviet Imperialism. The workers produce. The soldiers defend. The party commands. The empire expands. Individual rights exist only in service to the collective mission."
 USR_red_imperial_constitution:0 "The Red Imperial Constitution"
 USR_red_imperial_constitution_desc:0 "A new constitution codifies absolute political unity, military supremacy, state ownership of strategic industry, and the permanent emergency powers of the Imperial Presidium."
 USR_proclaim_soviet_empire:0 "Proclaim the Soviet Empire"
 USR_proclaim_soviet_empire_desc:0 "The transition is complete. The Neo-Soviet Union is dead. In its place stands the Soviet Empire—a state built on communist imagery, military government, centralized planning, and territorial expansion. Chairman Voronin addresses the nation: 'We do not apologize for the word empire. Empires endure. Republics negotiate their own extinction.'"

 # ---- Red Fortress Branch ----
 USR_se_imperial_general_staff:0 "The Imperial General Staff"
 USR_se_imperial_general_staff_desc:0 "A unified military command structure replaces the divided Soviet-era system. The General Staff answers directly to Chairman Voronin and coordinates all ground, air, naval, and strategic forces."
 USR_guards_army_every_region:0 "A Guards Army in Every Region"
 USR_guards_army_every_region_desc:0 "Elite Guards armies are deployed to every administrative region. They serve as both military garrisons and political enforcers, ensuring no republic or territory considers defiance."
 USR_cybernetic_political_commissars:0 "Cybernetic Political Commissars"
 USR_cybernetic_political_commissars_desc:0 "Political commissars are enhanced with neural monitoring and communication implants. They detect dissent before it forms, report instantaneously, and maintain perfect ideological discipline."
 USR_deep_battle_new_century:0 "Deep Battle for the New Century"
 USR_deep_battle_new_century_desc:0 "Soviet deep battle doctrine is updated for 2069: networked armored formations, orbital reconnaissance, electronic warfare, and massed precision strikes deep behind enemy lines."
 USR_continental_missile_shield:0 "The Continental Missile Shield"
 USR_continental_missile_shield_desc:0 "A hemisphere-spanning missile defense network protects the Empire's heartland. Orbital sensors, hypersonic interceptors, and directed-energy platforms create an impenetrable dome over Eurasia."
 USR_militarize_western_frontier:0 "Militarize the Western Frontier"
 USR_militarize_western_frontier_desc:0 "The Empire's western border becomes the most fortified frontier on Earth. Defensive positions, rapid-deployment forces, and forward bases ensure that no western power can threaten the heartland."
 USR_no_republic_defy_moscow:0 "No Republic May Defy Moscow"
 USR_no_republic_defy_moscow_desc:0 "Internal security reaches its final form. Every administrative region is garrisoned, surveilled, and politically controlled. Separatism is not suppressed—it is made impossible."

 # ---- Imperial Planned Economy Branch ----
 USR_allunion_planning_directorate:0 "The All-Union Planning Directorate"
 USR_allunion_planning_directorate_desc:0 "Central planning returns at continental scale. The Directorate coordinates all industrial output, resource allocation, and infrastructure development across the Empire."
 USR_integrate_gazprom_networks:0 "Integrate Gazprom's Networks"
 USR_integrate_gazprom_networks_desc:0 "Gazprom's vast pipeline networks, processing facilities, and distribution infrastructure are absorbed into the People's Gas Commissariat. Private gas ownership is abolished."
 USR_se_nationalize_sovoil:0 "Nationalize SovOil"
 USR_se_nationalize_sovoil_desc:0 "SovOil's oil fields, refineries, and strategic reserves become state property under the All-Union Petroleum Combine. Its former executives are reassigned as state industrial administrators."
 USR_siberian_industrial_corridor:0 "The Siberian Industrial Corridor"
 USR_siberian_industrial_corridor_desc:0 "A massive industrialization program transforms Siberia into the Empire's manufacturing heartland. New cities, factories, and transportation networks rise across the frozen interior."
 USR_automated_military_production:0 "Automated Military Production"
 USR_automated_military_production_desc:0 "Cybernetically controlled production lines manufacture weapons, vehicles, and ammunition with minimal human labor. The Empire's factories never sleep."
 USR_consumer_sacrifice_imperial:0 "Consumer Sacrifice for Imperial Strength"
 USR_consumer_sacrifice_imperial_desc:0 "Consumer goods are rationed to fund military production. The population endures shortages while the army receives the finest equipment. Imperial strength demands civilian sacrifice."
 USR_arsenal_of_eurasia:0 "The Arsenal of Eurasia"
 USR_arsenal_of_eurasia_desc:0 "The Empire's industrial machine reaches full capacity. Military production is staggering, but the cost is borne by every citizen in empty shelves, crowded housing, and endless labor quotas."

 # ---- Eurasian Offensive Branch ----
 USR_empire_no_natural_borders:0 "The Empire Has No Natural Borders"
 USR_empire_no_natural_borders_desc:0 "Chairman Voronin declares that the Empire's borders are defined by strategic necessity, not geography. Where the Empire's security requires expansion, expansion will follow."
 USR_restore_western_security_zone:0 "Restore the Western Security Zone"
 USR_restore_western_security_zone_desc:0 "The former Soviet buffer states must return to the Empire's sphere. Eastern Europe's independence was a strategic error that will be corrected."
 USR_ultimatum_european_borderlands:0 "Ultimatum to the European Borderlands"
 USR_ultimatum_european_borderlands_desc:0 "Formal demands are delivered to Poland, Romania, and Finland. Accept Soviet military basing and political coordination—or face the consequences."
 USR_dominate_the_caucasus:0 "Dominate the Caucasus"
 USR_dominate_the_caucasus_desc:0 "The Caucasus region is placed under direct military administration. Its oil fields, strategic passes, and ethnic tensions require firm imperial control."
 USR_secure_persian_corridor:0 "Secure the Persian Corridor"
 USR_secure_persian_corridor_desc:0 "The Empire extends its reach southward through Iran. Warm-water access and Persian Gulf influence have been a Russian strategic ambition for centuries."
 USR_contest_china_central_asia:0 "Contest China in Central Asia"
 USR_contest_china_central_asia_desc:0 "Central Asia's resources and strategic position make it a theater of competition with China. The Empire will not yield the heartland to any rival."
 USR_red_pacific_strategy:0 "The Red Pacific Strategy"
 USR_red_pacific_strategy_desc:0 "The Soviet Pacific Fleet is expanded and modernized. Naval bases in the Far East project power across the Pacific, challenging American and Chinese maritime dominance."
 USR_se_break_atlantic_encirclement:0 "Break the Atlantic Encirclement"
 USR_se_break_atlantic_encirclement_desc:0 "The Empire prepares to break the Atlantic alliance system. If the New United States cannot be reasoned with, it will be confronted."
 USR_world_continental_empires:0 "A World of Continental Empires"
 USR_world_continental_empires_desc:0 "The Soviet Empire achieves its ultimate ambition: a world order divided among continental powers, with Eurasia—the heartland—as the supreme force. Democracy is an experiment. Empires are permanent."

 # ---- Soviet Empire Spirits ----
 USR_committee_restoration_spirit:0 "Committee for Soviet Restoration"
 USR_committee_restoration_spirit_desc:0 "A secret committee of military officers, security officials, and hardline administrators coordinates the silent takeover of every state institution."
 USR_imperial_presidium_spirit:0 "The Imperial Presidium"
 USR_imperial_presidium_spirit_desc:0 "Military government under Chairman Voronin. The Supreme Soviet has voted itself out of power. Emergency administration replaces constitutional rule."
 USR_centralized_republics_spirit:0 "Centralized Republics"
 USR_centralized_republics_spirit_desc:0 "The union republics have been stripped of political autonomy and reduced to administrative divisions. Cultural institutions survive; political independence does not."
 USR_se_general_staff_spirit:0 "Imperial General Staff"
 USR_se_general_staff_spirit_desc:0 "A unified military command structure coordinates all Soviet Imperial armed forces under direct presidential authority."
 USR_cybernetic_commissars_spirit:0 "Cybernetic Political Commissars"
 USR_cybernetic_commissars_spirit_desc:0 "Neural-enhanced political officers monitor ideological discipline in real time. Dissent is detected and reported before it can spread."
 USR_missile_shield_spirit:0 "Continental Missile Shield"
 USR_missile_shield_spirit_desc:0 "A hemisphere-spanning defense network of orbital sensors, hypersonic interceptors, and directed-energy platforms protects the Empire's heartland."
 USR_allunion_planning_spirit:0 "All-Union Planning Directorate"
 USR_allunion_planning_spirit_desc:0 "Central planning coordinates all industrial output and resource allocation across the Empire. Efficient but bureaucratic."
 USR_consumer_sacrifice_spirit:0 "Consumer Sacrifice"
 USR_consumer_sacrifice_spirit_desc:0 "Consumer goods are rationed to fund massive military production. The population endures hardship while the army grows stronger."
 USR_arsenal_eurasia_spirit:0 "Arsenal of Eurasia"
 USR_arsenal_eurasia_spirit_desc:0 "The Empire's industrial machine operates at maximum capacity. Military output is staggering, though civilian shortages persist."
 USR_eurasian_offensive_spirit:0 "The Eurasian Offensive"
 USR_eurasian_offensive_spirit_desc:0 "The Empire recognizes no natural borders. Expansion is justified as creating strategic buffers for continental security."
 USR_red_colossus_spirit:0 "The Red Imperial Colossus"
 USR_red_colossus_spirit_desc:0 "The Soviet Empire stands as a continental superpower. Enormous military strength and industrial output are balanced by consumer shortages, bureaucratic corruption, and permanent political repression."

 # ---- Soviet Empire Events ----
 usr_soviet_empire.1.t:0 "The Emergency Session"
 usr_soviet_empire.1.d:0 "Marshal Voronin enters the Supreme Soviet chamber in full military dress. Behind him, the Committee for Soviet Restoration's inner circle takes their positions. Outside, tanks of the Moscow Military District have quietly sealed every approach to the government quarter.\n\nVoronin speaks for forty minutes. He describes foreign interference, corporate sabotage, separatist conspiracies, and the systematic betrayal of the Soviet people by their own government. He demands:\n\n• Suspension of the existing constitution\n• Creation of an Imperial Presidium with emergency powers\n• Centralization of the union republics\n• Nationalization of all strategic corporations\n• His appointment as Chairman\n\nThe delegates listen in silence. They already know how they will vote."
 usr_soviet_empire.1.a:0 "The vote is a formality."
 usr_soviet_empire.2.t:0 "The Coup Without Gunfire"
 usr_soviet_empire.2.d:0 "The takeover unfolds in perfect silence. Loyal soldiers guard every government building. State security detains opposition leaders in their homes. Military communications officers assume control of all broadcast networks.\n\nGazprom's directors are summoned and informed that their corporation now serves the state. SovOil's Energy Guard receives disarmament orders signed by its own commanding officers—every one a Committee loyalist.\n\nThe Supreme Soviet convenes for the last time. The vote to dissolve itself and transfer all authority to the Imperial Presidium passes with a two-thirds majority. Several delegates weep. None vote against.\n\nMarshal Alexei Voronin is proclaimed Chairman of the Imperial Presidium. He does not celebrate. He issues his first directive: all republican borders are now administrative lines. All corporate charters are suspended pending review. All military forces answer to the General Staff.\n\nThere is no civil war because every institution capable of resisting has already been captured."
 usr_soviet_empire.2.a:0 "The Union is restored. The Empire begins."
 usr_soviet_empire.3.t:0 "Proclaim the Soviet Empire"
 usr_soviet_empire.3.d:0 "Chairman Voronin addresses the nation from the Kremlin:\n\n'Citizens of the Soviet state. The era of compromise is over. The era of weakness is over. The era of federal negotiation, corporate independence, and republican defiance is over.\n\nWe do not apologize for the word empire. Empires endure. Republics negotiate their own extinction. The Soviet Empire will endure because it is built on discipline, labor, military strength, and the absolute unity of its people.\n\nFrom this day forward, we are one state, one army, one economy, one purpose. No republic may withdraw. No corporation may defy the planning directives. No foreign power may dictate our borders.\n\nThe Soviet Empire is proclaimed. Long live the workers. Long live the soldiers. Long live the state.'\n\nThe red flag rises over every government building across eleven time zones. It bears a new emblem: the hammer and sickle crowned by an imperial star."
 usr_soviet_empire.3.a:0 "Long live the Soviet Empire."
 usr_soviet_empire.4.t:0 "The People's Gas Commissariat"
 usr_soviet_empire.4.d:0 "Gazprom Corporation ceases to exist. Its board of directors is dissolved. Its shareholders receive nothing. Its vast pipeline networks, processing facilities, and distribution infrastructure are transferred to the newly created People's Gas Commissariat.\n\nFormer Gazprom executives are offered positions as state industrial administrators. Most accept. Those who refuse are reassigned to planning bureaus in remote Siberian cities.\n\nThe gas flows as before. The profits now serve the state."
 usr_soviet_empire.4.a:0 "The gas belongs to the people."
 usr_soviet_empire.5.t:0 "The All-Union Petroleum Combine"
 usr_soviet_empire.5.d:0 "SovOil's corporate charter is formally annulled. Its oil fields, refineries, tanker fleets, and strategic petroleum reserves become state property under the All-Union Petroleum Combine.\n\nThe Energy Guard—SovOil's private army—is disbanded. Its soldiers are absorbed into the Soviet Imperial Army. Its officers face loyalty reviews. SovOil's corporate territory is reintegrated into the administrative system.\n\nThe board members who cooperated during the coup are appointed to planning positions. Those who resisted are in custody.\n\nThe age of corporate petroleum sovereignty in Russia is over. Oil belongs to the Empire."
 usr_soviet_empire.5.a:0 "Oil belongs to the Empire."
 usr_soviet_empire.6.t:0 "The Soviet Ultimatum"
 usr_soviet_empire.6.d:0 "The Soviet Empire has delivered a formal ultimatum. Their ambassador presents demands for military basing rights, political coordination agreements, and integration into the Empire's continental security architecture.\n\nThe alternative, the ambassador explains with practiced calm, is unspecified but clearly military. Soviet Imperial divisions are already massing on the border."
 usr_soviet_empire.6.a:0 "We have no choice but to accept."
 usr_soviet_empire.6.b:0 "We will never submit to Moscow."
 usr_soviet_empire.7.t:0 "A Borderland Submits"
 usr_soviet_empire.7.d:0 "The government has accepted the Soviet Empire's demands. Its territory will be integrated into the Empire's continental security zone. Its independence exists now only on paper."
 usr_soviet_empire.7.a:0 "The Empire expands."

 # ---- Soviet Empire Decisions ----
 USR_soviet_imperial_influence_decisions:0 "Soviet Imperial Influence"
 USR_appoint_loyal_secretary:0 "Appoint a Loyal Regional Secretary"
 USR_appoint_loyal_secretary_desc:0 "Place a Committee loyalist in a key regional party position."
 USR_promote_imperial_officer_dec:0 "Promote an Imperial Officer"
 USR_promote_imperial_officer_dec_desc:0 "Advance a loyalist officer to a position of command authority."
 USR_compromise_delegate:0 "Compromise a Supreme Soviet Delegate"
 USR_compromise_delegate_desc:0 "Use the Directorate's files to secure a delegate's cooperation."
 USR_expose_federalist_corruption:0 "Expose Federalist Corruption"
 USR_expose_federalist_corruption_desc:0 "Leak evidence of corruption among federalist politicians."
 USR_fund_veterans_organizations:0 "Fund the Veterans' Organizations"
 USR_fund_veterans_organizations_desc:0 "Channel resources to veterans' groups that support the Committee's agenda."
 USR_place_commissars_general_staff:0 "Place Commissars in the General Staff"
 USR_place_commissars_general_staff_desc:0 "Insert political officers into the military command structure."
 USR_secure_broadcast_network:0 "Secure the Moscow Broadcast Network"
 USR_secure_broadcast_network_desc:0 "Place loyalists in control of the capital's communications infrastructure."
 USR_replace_republican_minister:0 "Replace a Republican Interior Minister"
 USR_replace_republican_minister_desc:0 "Remove an unreliable republican official and install a Committee appointee."
 USR_strategic_readiness_exercise:0 "Order a Strategic Readiness Exercise"
 USR_strategic_readiness_exercise_desc:0 "Conduct military exercises that position loyal units near key government facilities."
 USR_demand_corporate_records:0 "Demand Corporate Financial Records"
 USR_demand_corporate_records_desc:0 "Force energy corporations to submit their financial records for state review."
 USR_influence_gain_1_tt:0 "§G+1 Soviet Imperial Influence§!"
 USR_influence_gain_2_tt:0 "§G+2 Soviet Imperial Influence§!"
 USR_influence_gain_3_tt:0 "§G+3 Soviet Imperial Influence§!"
