l_english:
 ### =============================================================
 ### NUS FOCUS TREE — "THE FRACTURED WORLD, 2069"
 ### =============================================================

 # --- Opening ---
 NUS_state_of_the_union:0 "State of the Union"
 NUS_state_of_the_union_desc:0 "President Myers must address a nation still smoldering from reconstruction. Congress, the corporate boards, and the street all expect answers she does not have."
 NUS_state_of_the_union_tt:0 "The federal government buys itself a little time."
 NUS_constitutional_crisis:0 "The Constitutional Crisis Deepens"
 NUS_constitutional_crisis_desc:0 "Emergency powers, corporate lobbying, street militias, and underground cells all press against the frame of a republic that was never built for this century. Something has to give."
 NUS_constitutional_crisis_tt:0 "Four futures for the New United States now stand open."

 # ================================================================
 # PATH 1 — FASCIST: EMPIRE OF AMERICA
 # ================================================================
 NUS_america_first_movement:0 "The America First Movement"
 NUS_america_first_movement_desc:0 "A coalition of nationalist officers, street militias, and disillusioned bureaucrats offers the President a simple deal: absolute order, in exchange for absolute power."
 NUS_national_salvation_council:0 "Form the National Salvation Council"
 NUS_national_salvation_council_desc:0 "A shadow cabinet of loyalists is assembled outside the normal chain of command, answerable only to the movement."
 NUS_patriot_brigades:0 "Raise the Patriot Brigades"
 NUS_patriot_brigades_desc:0 "Paramilitary auxiliaries recruited from veterans, corpo security washouts, and true believers begin patrolling reconstruction zones."
 NUS_emergency_powers_act:0 "Pass the Emergency Powers Act"
 NUS_emergency_powers_act_desc:0 "Congress is pressured into voting itself out of the decision-making loop 'for the duration of the crisis.'"
 NUS_purge_dissenters:0 "Purge the Dissenters"
 NUS_purge_dissenters_desc:0 "Journalists, union organizers, and rival politicians disappear into the Patriot Brigade Network's growing list of detention sites."
 NUS_loyal_officer_corps:0 "Cultivate a Loyal Officer Corps"
 NUS_loyal_officer_corps_desc:0 "Promotions are quietly redirected toward officers who have sworn personal loyalty to the movement over the Constitution."
 NUS_militarize_homeland:0 "Militarize the Homeland"
 NUS_militarize_homeland_desc:0 "National Guard armories are federalized and checkpoints spread across every reconstruction corridor."
 NUS_iron_eagle_doctrine:0 "Adopt the Iron Eagle Doctrine"
 NUS_iron_eagle_doctrine_desc:0 "A new military doctrine built around rapid internal deployment, mass mobilization, and unquestioning obedience is formally adopted."
 NUS_fascist_court_militech:0 "Court Militech's Board"
 NUS_fascist_court_militech_desc:0 "Militech's directors are offered federal contracts, tax exemptions, and a freer hand — if their private armies back the movement when it matters."
 NUS_fascist_court_petrochem:0 "Court PetroChem's Board"
 NUS_fascist_court_petrochem_desc:0 "PetroChem is promised uncontested control of the continent's refineries and pipelines in exchange for loyalty when the crisis breaks."
 NUS_march_on_washington:0 "March on Washington"
 NUS_march_on_washington_desc:0 "The Patriot Brigades and their sympathizers in uniform move on the capital. The old republic will not survive what comes next."
 NUS_march_on_washington_tt:0 "The movement makes its move. Civil war is now inevitable."
 NUS_crush_the_resistance:0 "Crush the Resistance"
 NUS_crush_the_resistance_desc:0 "Loyalist holdouts are surrounded, starved of supply, and broken city by city."
 NUS_purge_the_officer_corps:0 "Purge the Officer Corps"
 NUS_purge_the_officer_corps_desc:0 "Every commander who hesitated during the uprising is quietly retired — or worse."
 NUS_total_war_footing:0 "Place the Nation on Total War Footing"
 NUS_total_war_footing_desc:0 "Every arms factory in the reconstruction zone is placed under direct military administration."
 NUS_imperial_guard_legions:0 "Raise the Imperial Guard Legions"
 NUS_imperial_guard_legions_desc:0 "The Patriot Brigades are reforged into standing legions, personally loyal to the new order."
 NUS_nationalize_war_industry:0 "Nationalize War Industry"
 NUS_nationalize_war_industry_desc:0 "Private arms and petrochemical concerns are folded directly into the state apparatus."
 NUS_forced_labor_battalions:0 "Organize Forced Labor Battalions"
 NUS_forced_labor_battalions_desc:0 "'Reconstruction labor service' becomes mandatory for anyone the new regime deems insufficiently loyal."
 NUS_imperial_war_economy:0 "Establish the Imperial War Economy"
 NUS_imperial_war_economy_desc:0 "Every factory, refinery, and shipyard on the continent now answers to the war ministry."
 NUS_american_imperium:0 "Declare the American Imperium"
 NUS_american_imperium_desc:0 "The transformation is complete. What remains of the old republic is folded into a single, absolute imperial state."
 NUS_continental_hegemony:0 "Pursue Continental Hegemony"
 NUS_continental_hegemony_desc:0 "The Imperium sets its sights on every rival claimant to the old United States — Texas, the Free States, the corporate enclaves, all of it."
 NUS_continental_hegemony_tt:0 "The Imperium's war ministry begins drafting continental war plans."
 NUS_proclaim_empire_of_america:0 "Proclaim the Empire of America"
 NUS_proclaim_empire_of_america_desc:0 "Rosalind Myers is crowned Regent-Protector of a new Empire built on the ashes of the old republic."

 # ================================================================
 # PATH 2 — ACCELERATIONIST / CORPORATE: CONFEDERATION OF
 # CORPORATE STATES
 # ================================================================
 NUS_accelerationist_manifesto:0 "The Accelerationist Manifesto"
 NUS_accelerationist_manifesto_desc:0 "A coalition of megacorp boards argues the quiet part out loud: the state is an inefficiency the market can no longer afford to tolerate."
 NUS_board_of_directors_ascendant:0 "The Board of Directors Ascendant"
 NUS_board_of_directors_ascendant_desc:0 "An informal council of corporate chairmen begins meeting in parallel with the President's cabinet — and increasingly, instead of it."
 NUS_deregulation_blitz:0 "Launch a Deregulation Blitz"
 NUS_deregulation_blitz_desc:0 "Entire regulatory agencies are defunded overnight in the name of 'unlocking growth.'"
 NUS_privatize_federal_services:0 "Privatize Federal Services"
 NUS_privatize_federal_services_desc:0 "Water, power, and even parts of the justice system are auctioned to the highest corporate bidder."
 NUS_market_above_law:0 "Place the Market Above the Law"
 NUS_market_above_law_desc:0 "Corporate charters are rewritten to place shareholder interest explicitly above federal statute."
 NUS_corporate_lobbying_offensive:0 "Launch a Corporate Lobbying Offensive"
 NUS_corporate_lobbying_offensive_desc:0 "Every seat in Congress suddenly has a corporate liaison office attached to it."
 NUS_shareholders_over_citizens:0 "Shareholders Over Citizens"
 NUS_shareholders_over_citizens_desc:0 "A new doctrine of governance declares that shareholder value is the only legitimate measure of the public good."
 NUS_dissolve_congress:0 "Dissolve Congress"
 NUS_dissolve_congress_desc:0 "An emergency 'Board of Continuity' is installed to replace the legislature, staffed entirely by corporate appointees."
 NUS_corporate_court_militech:0 "Court Militech's Board"
 NUS_corporate_court_militech_desc:0 "Militech is offered a permanent seat on the Board of Continuity in exchange for its private legions."
 NUS_corporate_court_petrochem:0 "Court PetroChem's Board"
 NUS_corporate_court_petrochem_desc:0 "PetroChem is promised total deregulation of continental extraction rights if its board backs the takeover."
 NUS_hostile_takeover:0 "Hostile Takeover"
 NUS_hostile_takeover_desc:0 "The Board of Directors moves to formally seize control of the federal government itself."
 NUS_hostile_takeover_tt:0 "The corporate coalition makes its move. Civil war is now inevitable."
 NUS_establish_corporate_order:0 "Establish the Corporate Order"
 NUS_establish_corporate_order_desc:0 "Federal ministries are reorganized as subsidiaries, each with its own CEO and profit target."
 NUS_privatize_the_armed_forces:0 "Privatize the Armed Forces"
 NUS_privatize_the_armed_forces_desc:0 "Standing army units are spun off into private military contractors bidding for federal defense contracts."
 NUS_mercenary_legions:0 "Raise Mercenary Legions"
 NUS_mercenary_legions_desc:0 "Contract soldiers from across the hemisphere are recruited under corporate banners rather than the flag."
 NUS_corporate_security_state:0 "Build the Corporate Security State"
 NUS_corporate_security_state_desc:0 "Private security contractors quietly absorb what remains of federal law enforcement."
 NUS_abolish_labor_law:0 "Abolish Labor Law"
 NUS_abolish_labor_law_desc:0 "The last remaining protections for reconstruction-zone workers are struck from the federal code."
 NUS_total_shareholder_value:0 "Pursue Total Shareholder Value"
 NUS_total_shareholder_value_desc:0 "Every remaining public asset is restructured to maximize quarterly returns."
 NUS_post_national_economy:0 "Build the Post-National Economy"
 NUS_post_national_economy_desc:0 "Corporate charters formally supersede national citizenship as the primary legal identity for millions of Americans."
 NUS_ceo_council_supreme:0 "The CEO Council Supreme"
 NUS_ceo_council_supreme_desc:0 "A council of chief executives formally replaces the presidency as the nation's highest authority."
 NUS_free_market_conquers_all:0 "The Free Market Conquers All"
 NUS_free_market_conquers_all_desc:0 "The Confederation's board sets its sights on every market, resource, and rival still outside its control."
 NUS_free_market_conquers_all_tt:0 "The CEO Council authorizes hostile expansion across the continent."
 NUS_proclaim_corporate_confederation:0 "Proclaim the Confederation of Corporate States"
 NUS_proclaim_corporate_confederation_desc:0 "The New United States is formally dissolved and reincorporated as a confederation of sovereign corporate states."

 # ================================================================
 # PATH 3 — FEDERALIST: AMERICAN FEDERATION
 # ================================================================
 NUS_federalist_restoration:0 "The Federalist Restoration"
 NUS_federalist_restoration_desc:0 "A coalition of judges, veteran legislators, and civic reformers argues the republic can still be saved — if it is rebuilt honestly."
 NUS_defend_the_constitution:0 "Defend the Constitution"
 NUS_defend_the_constitution_desc:0 "A cross-party caucus commits to defending the remaining constitutional order against all comers, corporate or militarist."
 NUS_free_press_act:0 "Pass the Free Press Act"
 NUS_free_press_act_desc:0 "Federal protections for independent journalism are restored for the first time since the collapse."
 NUS_restore_free_elections:0 "Restore Free Elections"
 NUS_restore_free_elections_desc:0 "A binding timetable for open, monitored elections is written into federal law."
 NUS_civilian_oversight_military:0 "Establish Civilian Oversight of the Military"
 NUS_civilian_oversight_military_desc:0 "An independent civilian board is granted real authority over military promotions and deployments."
 NUS_anti_corporate_legislation:0 "Draft Anti-Corporate Legislation"
 NUS_anti_corporate_legislation_desc:0 "The first serious antitrust bill in decades is introduced against the megacorp subjects."
 NUS_break_monopolies:0 "Break the Monopolies"
 NUS_break_monopolies_desc:0 "Federal courts begin forcibly splitting the largest corporate conglomerates operating on NUSA soil."
 NUS_federal_regulatory_authority:0 "Restore Federal Regulatory Authority"
 NUS_federal_regulatory_authority_desc:0 "Regulatory agencies gutted during the collapse are rebuilt with real enforcement teeth."
 NUS_federalist_court_militech:0 "Negotiate with Militech's Board"
 NUS_federalist_court_militech_desc:0 "Militech is offered continued autonomy and federal contracts in exchange for staying out of the coming fight — a hard sell to a corp that hates oversight."
 NUS_federalist_court_petrochem:0 "Negotiate with PetroChem's Board"
 NUS_federalist_court_petrochem_desc:0 "PetroChem is offered environmental amnesty and long-term supply contracts in exchange for backing the restoration."
 NUS_democratic_revolution:0 "The Democratic Revolution"
 NUS_democratic_revolution_desc:0 "Reformers move to force the issue, calling for a national convention to formally re-found the republic — over the objections of every entrenched interest."
 NUS_democratic_revolution_tt:0 "The reform coalition makes its move. Civil war is now inevitable."
 NUS_rebuild_the_republic:0 "Rebuild the Republic"
 NUS_rebuild_the_republic_desc:0 "With the old guard defeated, the work of reconstruction can finally begin in earnest."
 NUS_reconvene_congress:0 "Reconvene a Free Congress"
 NUS_reconvene_congress_desc:0 "A newly elected Congress is sworn in under armed guard, but sworn in nonetheless."
 NUS_supreme_court_restoration:0 "Restore the Supreme Court"
 NUS_supreme_court_restoration_desc:0 "An independent judiciary is reconstituted, free of corporate or military appointees."
 NUS_national_referendum_act:0 "Pass the National Referendum Act"
 NUS_national_referendum_act_desc:0 "Citizens are granted direct binding referenda over major national policy for the first time in the republic's history."
 NUS_public_investment_program:0 "Launch a Public Investment Program"
 NUS_public_investment_program_desc:0 "Federal capital flows directly into reconstruction projects, bypassing the corporate subjects entirely."
 NUS_federal_infrastructure_act:0 "Pass the Federal Infrastructure Act"
 NUS_federal_infrastructure_act_desc:0 "Roads, rail, and power grids are rebuilt under direct federal ownership."
 NUS_new_deal_reconstruction:0 "Launch New Deal Reconstruction"
 NUS_new_deal_reconstruction_desc:0 "A sweeping public works program puts millions of reconstruction-zone residents back to work under federal contract."
 NUS_bill_of_rights_renewed:0 "The Bill of Rights Renewed"
 NUS_bill_of_rights_renewed_desc:0 "A renewed constitutional convention formally re-ratifies and expands the republic's founding guarantees."
 NUS_arsenal_of_democracy:0 "Build the Arsenal of Democracy"
 NUS_arsenal_of_democracy_desc:0 "The rebuilt republic mobilizes its restored industry in defense of democratic government everywhere on the continent."
 NUS_arsenal_of_democracy_tt:0 "Federal arsenals begin supplying every democratic movement still standing."
 NUS_proclaim_american_federation:0 "Proclaim the American Federation"
 NUS_proclaim_american_federation_desc:0 "The New United States is formally re-founded as the American Federation, a restored constitutional republic."

 # ================================================================
 # PATH 4 — COMMUNIST: UNION OF SOCIALIST STATES OF AMERICA
 # ================================================================
 NUS_workers_revolution:0 "The Workers' Revolution"
 NUS_workers_revolution_desc:0 "Reconstruction-zone labor councils, dispossessed farmers, and underground organizers declare that neither the state nor the corporations have earned the right to rebuild America."
 NUS_revolutionary_vanguard_party:0 "Form the Revolutionary Vanguard Party"
 NUS_revolutionary_vanguard_party_desc:0 "A disciplined cadre organization begins coordinating cells across every reconstruction zone."
 NUS_underground_cells:0 "Organize Underground Cells"
 NUS_underground_cells_desc:0 "Clandestine organizing networks spread through factory floors and refugee camps alike."
 NUS_agitate_the_masses:0 "Agitate the Masses"
 NUS_agitate_the_masses_desc:0 "Open agitation replaces underground organizing as the movement's confidence grows."
 NUS_general_strike:0 "Call a General Strike"
 NUS_general_strike_desc:0 "Reconstruction-zone labor grinds to a halt as workers walk out en masse."
 NUS_seize_means_of_production:0 "Seize the Means of Production"
 NUS_seize_means_of_production_desc:0 "Worker committees begin physically occupying factories, refineries, and depots."
 NUS_workers_councils:0 "Establish Workers' Councils"
 NUS_workers_councils_desc:0 "Elected worker councils take over day-to-day management of occupied industry."
 NUS_nationalize_everything:0 "Nationalize Everything"
 NUS_nationalize_everything_desc:0 "Every remaining private industrial asset is formally transferred to collective ownership."
 NUS_communist_court_militech:0 "Attempt to Court Militech's Board"
 NUS_communist_court_militech_desc:0 "A near-hopeless overture is made to Militech's board, offering nationalized contracts in place of nationalized assets. Corporate boards do not, as a rule, love revolutions."
 NUS_communist_court_petrochem:0 "Attempt to Court PetroChem's Board"
 NUS_communist_court_petrochem_desc:0 "PetroChem's directors are offered a token role in the new order — an offer they view, correctly, as a formality before expropriation."
 NUS_red_dawn_rising:0 "Red Dawn Rising"
 NUS_red_dawn_rising_desc:0 "Worker militias and revolutionary cells move to seize state power outright before the old order can regroup."
 NUS_red_dawn_rising_tt:0 "The revolution makes its move. Civil war is now inevitable."
 NUS_peoples_republic:0 "Declare the People's Republic"
 NUS_peoples_republic_desc:0 "With the old state apparatus in retreat, a provisional People's Republic is declared."
 NUS_arm_the_workers:0 "Arm the Workers"
 NUS_arm_the_workers_desc:0 "Factory militias are formally issued arms from captured federal armories."
 NUS_red_guard_militias:0 "Organize Red Guard Militias"
 NUS_red_guard_militias_desc:0 "Worker militias are reorganized into a disciplined Red Guard under central command."
 NUS_revolutionary_armed_forces:0 "Form the Revolutionary Armed Forces"
 NUS_revolutionary_armed_forces_desc:0 "The Red Guard, defecting army units, and worker militias are merged into a single revolutionary military."
 NUS_five_year_plan:0 "Launch the First Five-Year Plan"
 NUS_five_year_plan_desc:0 "Central planners set ambitious targets for collectivized industry across every reconstruction zone."
 NUS_collectivize_industry:0 "Collectivize Industry"
 NUS_collectivize_industry_desc:0 "The last privately-held factories and refineries are brought under collective management."
 NUS_planned_economy_triumphant:0 "The Planned Economy Triumphant"
 NUS_planned_economy_triumphant_desc:0 "Central planning boards now coordinate production across the entire liberated territory."
 NUS_socialist_industrial_plan:0 "Adopt the Socialist Industrial Plan"
 NUS_socialist_industrial_plan_desc:0 "The Revolutionary Armed Forces and the planned economy are formally integrated under a single continental strategy."
 NUS_world_revolution_begins:0 "World Revolution Begins Here"
 NUS_world_revolution_begins_desc:0 "The People's Republic declares its intention to export the revolution to every corner of the continent still under corporate or fascist rule."
 NUS_world_revolution_begins_tt:0 "Revolutionary cadres begin organizing beyond the republic's borders."
 NUS_proclaim_ussa:0 "Proclaim the Union of Socialist States of America"
 NUS_proclaim_ussa_desc:0 "The People's Republic is formally re-founded as the Union of Socialist States of America."

 # ================================================================
 # CORPORATE COURTING TOOLTIPS (shared wording, path-specific keys)
 # ================================================================
 NUS_militech_courted_tt:0 "Militech's board takes note of the overture."
 NUS_petrochem_courted_tt:0 "PetroChem's board takes note of the overture."

 # ================================================================
 # SHARED BRANCHES
 # ================================================================
 NUS_federal_economic_review:0 "Federal Economic Review"
 NUS_federal_economic_review_desc:0 "A joint federal-corporate commission is convened to assess the true state of the reconstruction economy, regardless of which political path is ultimately chosen."
 NUS_reconstruction_bonds:0 "Issue Reconstruction Bonds"
 NUS_reconstruction_bonds_desc:0 "Federal bonds are floated to finance immediate rebuilding in the hardest-hit reconstruction zones."
 NUS_industrial_survey_corps:0 "Deploy an Industrial Survey Corps"
 NUS_industrial_survey_corps_desc:0 "Engineers and geologists fan out to catalog what remains of the nation's industrial base."
 NUS_currency_stabilization_act:0 "Pass a Currency Stabilization Act"
 NUS_currency_stabilization_act_desc:0 "The federal dollar is stabilized against runaway corporate scrip inflation."
 NUS_economic_foundation:0 "Lay the Economic Foundation"
 NUS_economic_foundation_desc:0 "Whatever government ultimately emerges from the crisis, it will inherit a more coherent economic base than the one it started with."
 NUS_pentagon_assessment:0 "Pentagon Readiness Assessment"
 NUS_pentagon_assessment_desc:0 "A joint chiefs review quietly concludes that the armed forces are in no condition for what's coming, regardless of who wins the argument in Washington."
 NUS_officer_corps_review:0 "Conduct an Officer Corps Review"
 NUS_officer_corps_review_desc:0 "Every commissioned officer's file is reviewed for competence, loyalty, and readiness."
 NUS_national_guard_mobilization:0 "Mobilize the National Guard"
 NUS_national_guard_mobilization_desc:0 "State and federal guard units are placed on standing alert across the reconstruction zones."
 NUS_defense_industrial_base:0 "Rebuild the Defense Industrial Base"
 NUS_defense_industrial_base_desc:0 "Federal investment flows into arms production regardless of who ultimately controls it."
 NUS_military_readiness:0 "Achieve Baseline Military Readiness"
 NUS_military_readiness_desc:0 "Whatever comes next, the armed forces will at least be ready for it."

 ### =============================================================
 ### NATIONAL SPIRITS
 ### =============================================================
 NUS_fragile_republic:0 "Fragile Republic"
 NUS_fragile_republic_desc:0 "The New United States is a patchwork of reconstruction authorities, corporate subjects, and half-enforced federal law. It could tear apart at any serious shock."
 NUS_petrochem_energy_dependency:0 "PetroChem Energy Dependency"
 NUS_petrochem_energy_dependency_desc:0 "Federal reconstruction runs on PetroChem fuel, plastics, and fertilizer. Washington cannot easily discipline a corporation it cannot function without."
 NUS_militech_wartime_support:0 "Militech Backs the Government"
 NUS_militech_wartime_support_desc:0 "Militech's private legions have thrown their weight behind the government side of the civil war."
 NUS_militech_wartime_defection:0 "Militech Backs the Opposition"
 NUS_militech_wartime_defection_desc:0 "Militech's board has quietly bankrolled the government's enemies rather than risk backing the losing side."
 NUS_petrochem_wartime_support:0 "PetroChem Backs the Government"
 NUS_petrochem_wartime_support_desc:0 "PetroChem's refineries and pipelines now operate in direct support of the government's war effort."
 NUS_petrochem_wartime_defection:0 "PetroChem Backs the Opposition"
 NUS_petrochem_wartime_defection_desc:0 "PetroChem has diverted fuel and materiel to the government's enemies, hedging against an uncertain outcome."

 # --- Fascist path spirits ---
 NUS_america_first_fervor:0 "America First Fervor"
 NUS_america_first_fervor_desc:0 "A wave of nationalist sentiment sweeps the reconstruction zones, hungry for order at any cost."
 NUS_emergency_powers_spirit:0 "Emergency Powers"
 NUS_emergency_powers_spirit_desc:0 "The legislature has surrendered its authority for 'the duration of the crisis.' No end date has been set."
 NUS_patriot_brigade_network:0 "Patriot Brigade Network"
 NUS_patriot_brigade_network_desc:0 "A nationwide network of loyalist paramilitaries now operates with tacit federal authority."
 NUS_iron_eagle_officer_corps:0 "Iron Eagle Officer Corps"
 NUS_iron_eagle_officer_corps_desc:0 "The officer corps has been remade in the movement's image — loyal, disciplined, and ready."
 NUS_imperial_consolidation:0 "Imperial Consolidation"
 NUS_imperial_consolidation_desc:0 "The old republic's institutions have been fully absorbed into the new imperial order."
 NUS_imperial_guard_supremacy:0 "Imperial Guard Supremacy"
 NUS_imperial_guard_supremacy_desc:0 "The Imperial Guard Legions stand as the unquestioned military backbone of the new order."
 NUS_total_war_economy:0 "Total War Economy"
 NUS_total_war_economy_desc:0 "Every factory in the Imperium now answers directly to the war ministry."
 NUS_empire_of_america_spirit:0 "Empire of America"
 NUS_empire_of_america_spirit_desc:0 "A new Empire stands where the republic once stood, forged in purges and paraded through the ruins of Washington."

 # --- Corporate path spirits ---
 NUS_shareholder_fervor:0 "Shareholder Fervor"
 NUS_shareholder_fervor_desc:0 "Boardrooms across the continent buzz with talk of a government finally run like a business."
 NUS_deregulated_markets:0 "Deregulated Markets"
 NUS_deregulated_markets_desc:0 "What regulatory apparatus remains exists mostly on paper."
 NUS_congress_dissolved_spirit:0 "Congress Dissolved"
 NUS_congress_dissolved_spirit_desc:0 "The legislature has been formally replaced by a corporate Board of Continuity."
 NUS_corporate_order_established:0 "Corporate Order Established"
 NUS_corporate_order_established_desc:0 "Federal ministries now operate as corporate subsidiaries, each pursuing its own bottom line."
 NUS_privatized_military_spirit:0 "Privatized Military"
 NUS_privatized_military_spirit_desc:0 "The armed forces have been substantially restructured around private contractors and mercenary legions."
 NUS_post_national_markets:0 "Post-National Markets"
 NUS_post_national_markets_desc:0 "Corporate charters have effectively superseded citizenship as the operative legal identity for most reconstruction-zone residents."
 NUS_corporate_confederation_spirit:0 "Confederation of Corporate States"
 NUS_corporate_confederation_spirit_desc:0 "A council of chief executives now governs what was once the New United States."

 # --- Federalist path spirits ---
 NUS_restoration_fervor:0 "Restoration Fervor"
 NUS_restoration_fervor_desc:0 "A cautious optimism spreads through reconstruction zones long starved of functioning institutions."
 NUS_free_press_restored:0 "Free Press Restored"
 NUS_free_press_restored_desc:0 "Independent journalism operates openly for the first time since the collapse."
 NUS_monopolies_broken:0 "Monopolies Broken"
 NUS_monopolies_broken_desc:0 "Federal courts have forced the breakup of the largest corporate conglomerates on NUSA soil."
 NUS_republic_rebuilding:0 "Republic Rebuilding"
 NUS_republic_rebuilding_desc:0 "The work of reconstruction proceeds under a restored constitutional government."
 NUS_referendum_democracy:0 "Referendum Democracy"
 NUS_referendum_democracy_desc:0 "Citizens now hold direct, binding authority over major national policy."
 NUS_new_deal_spirit:0 "New Deal Reconstruction"
 NUS_new_deal_spirit_desc:0 "Sweeping federal public works programs have put millions back to work."
 NUS_american_federation_spirit:0 "American Federation"
 NUS_american_federation_spirit_desc:0 "A restored constitutional republic governs the continent's reconstruction once more."

 # --- Communist path spirits ---
 NUS_revolutionary_fervor:0 "Revolutionary Fervor"
 NUS_revolutionary_fervor_desc:0 "Worker councils and underground cells organize openly for the first time, sensing the old order's weakness."
 NUS_general_strike_spirit:0 "General Strike"
 NUS_general_strike_spirit_desc:0 "Reconstruction-zone labor remains largely idle as the general strike continues."
 NUS_means_of_production_seized:0 "Means of Production Seized"
 NUS_means_of_production_seized_desc:0 "Worker committees now directly control the nation's remaining industrial base."
 NUS_peoples_republic_spirit:0 "People's Republic"
 NUS_peoples_republic_spirit_desc:0 "A provisional People's Republic governs the liberated reconstruction zones."
 NUS_revolutionary_army_spirit:0 "Revolutionary Armed Forces"
 NUS_revolutionary_army_spirit_desc:0 "The Red Guard and defecting army units now form a unified revolutionary military."
 NUS_planned_economy_spirit:0 "Planned Economy"
 NUS_planned_economy_spirit_desc:0 "Central planning boards coordinate production across all liberated territory."
 NUS_ussa_spirit:0 "Union of Socialist States of America"
 NUS_ussa_spirit_desc:0 "The revolution has formally re-founded the nation as a union of socialist states."

 # --- Shared branch spirits ---
 NUS_economic_foundation_spirit:0 "Economic Foundation Laid"
 NUS_economic_foundation_spirit_desc:0 "A more coherent economic base now underpins reconstruction, regardless of who ultimately governs it."
 NUS_military_readiness_spirit:0 "Baseline Military Readiness"
 NUS_military_readiness_spirit_desc:0 "The armed forces have reached a minimum standard of readiness."

 ### =============================================================
 ### CIVIL WAR EVENTS — nus_civil_war
 ### =============================================================

 # --- Path 1: Fascist ---
 nus_civil_war.1.t:0 "The Nation Divides"
 nus_civil_war.1.d:0 "Word of the America First Movement's growing influence spreads through the reconstruction zones. In some towns it is welcomed as the return of order. In others, it is met with barricades.\n\nEither way, the President's National Salvation Council is running out of patience with dissent."
 nus_civil_war.1.a:0 "Let them protest for now"
 nus_civil_war.1.b:0 "Warn the ringleaders privately"
 nus_civil_war.2.t:0 "March on Washington"
 nus_civil_war.2.d:0 "The Patriot Brigades are on the move, and half the officer corps is marching with them. What remains of the constitutional government has barely hours to decide whether to fight or flee.\n\nAcross the reconstruction zones, Militech and PetroChem's boards weigh which side of history to stand on."
 nus_civil_war.2.a:0 "Seize the capital"
 nus_civil_war.3.t:0 "The Old Republic Falls"
 nus_civil_war.3.d:0 "The last loyalist holdouts surrender or scatter into the hills. The National Salvation Council now governs in fact as well as name."
 nus_civil_war.3.a:0 "Consolidate power"

 # --- Path 2: Corporate ---
 nus_civil_war.4.t:0 "The Boardroom Coup"
 nus_civil_war.4.d:0 "The Board of Directors Ascendant has stopped pretending to advise the presidency and started openly directing it. Federal staffers increasingly report to corporate liaisons instead of their nominal superiors.\n\nA reckoning is coming."
 nus_civil_war.4.a:0 "Let the boardroom run its course"
 nus_civil_war.4.b:0 "Quietly consolidate loyalist support"
 nus_civil_war.5.t:0 "Hostile Takeover of the Republic"
 nus_civil_war.5.d:0 "The Board of Directors formally moves to seize the machinery of federal government, backed by private security forces, mercenary contractors, and no small number of sympathetic officers.\n\nMilitech and PetroChem's boards must decide, in the space of hours, which side of the ledger they want to be on."
 nus_civil_war.5.a:0 "Authorize the takeover"
 nus_civil_war.6.t:0 "The Shareholders Prevail"
 nus_civil_war.6.d:0 "Loyalist resistance collapses under the weight of superior corporate logistics and private security contracts. The Board of Directors now governs the continent's reconstruction directly."
 nus_civil_war.6.a:0 "Ratify the new order"

 # --- Path 3: Federalist ---
 nus_civil_war.7.t:0 "Voices in the Capitol"
 nus_civil_war.7.d:0 "The reform coalition's calls for a national refounding convention grow louder by the week, drawing support from exhausted reconstruction-zone communities on all sides of the crisis.\n\nEntrenched interests — corporate and militarist alike — are not pleased."
 nus_civil_war.7.a:0 "Encourage the reformers"
 nus_civil_war.7.b:0 "Proceed cautiously"
 nus_civil_war.8.t:0 "The Democratic Revolution"
 nus_civil_war.8.d:0 "Reformers formally call for a constitutional convention to re-found the republic on stronger footing. Entrenched security-state interests move to crush the convention before it can convene.\n\nMilitech and PetroChem's boards must choose between a government that will regulate them and one that might not survive the week."
 nus_civil_war.8.a:0 "Convene the assembly"
 nus_civil_war.9.t:0 "The Republic Endures"
 nus_civil_war.9.d:0 "The old guard's last stand collapses under the weight of a mobilized, exhausted, but determined citizenry. The convention proceeds."
 nus_civil_war.9.a:0 "Begin the work of rebuilding"

 # --- Path 4: Communist ---
 nus_civil_war.10.t:0 "The Workers Organize"
 nus_civil_war.10.d:0 "Strikes spread through the reconstruction zones faster than federal or corporate security can suppress them. Worker councils are forming in the open now, daring anyone to stop them.\n\nThe old order's response, so far, has been indecision."
 nus_civil_war.10.a:0 "Let the councils organize"
 nus_civil_war.10.b:0 "Quietly monitor the ringleaders"
 nus_civil_war.11.t:0 "Red Dawn Rising"
 nus_civil_war.11.d:0 "Worker militias and revolutionary cells move to seize state power outright, occupying federal buildings, armories, and transit hubs across the reconstruction zones.\n\nMilitech and PetroChem's boards, no friends of revolution under any circumstances, must nonetheless decide how to weather what comes next."
 nus_civil_war.11.a:0 "Seize the initiative"
 nus_civil_war.12.t:0 "All Power to the Soviets"
 nus_civil_war.12.d:0 "The old federal apparatus collapses faster than anyone expected. A provisional People's Republic now governs the liberated reconstruction zones."
 nus_civil_war.12.a:0 "Consolidate the revolution"

 # --- Shared proclamation event ---
 nus_civil_war.13.t:0 "A New Order Is Proclaimed"
 nus_civil_war.13.d:0 "Whatever the New United States was — fragile, patchwork, half-governed — it no longer exists. In its place stands something new, built in the crucible of civil war."
 nus_civil_war.13.a:0 "Let history record it"

